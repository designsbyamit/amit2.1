<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{background:#1D1B18}
.grain{position:absolute;inset:0;z-index:30;pointer-events:none;opacity:.22;mix-blend-mode:overlay}
.pool{position:absolute;inset:0;z-index:1;pointer-events:none}
.t{position:absolute;z-index:20}
.vel{position:absolute;border-radius:50%;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.stage{position:absolute;inset:0;perspective:1400px;z-index:5}
.plane{position:absolute;transform-style:preserve-3d}
.card{position:absolute;border-radius:6px;overflow:hidden;background:#EEE}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.tok{position:absolute;border-radius:50%}
.folio{font-family:'Bodoni 72',BodoniModa,serif;font-weight:300;color:transparent;-webkit-text-stroke:1px rgba(237,230,218,.18);line-height:.8}
</style></head><body>
<svg class="grain" width="100%" height="100%"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div id="root"></div>
<script src="copy.js"></script><script>
const W=innerWidth,H=innerHeight;let html=HDR+RAIL(+KF);const cp=COPY[KF];
const pool=(x,y,r,a)=>`<div class="pool" style="background:radial-gradient(${r}px ${r*.8}px at ${x}px ${y}px,rgba(200,245,90,${a}),rgba(200,245,90,${a*.25}) 40%,transparent 75%)"></div>`;
const bead=(x,y,s)=>`<div style="position:absolute;z-index:40;left:${x-s/2}px;top:${y-s/2}px;width:${s}px;height:${s}px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F4FFD6,#C8F55A 45%,#7AA800);box-shadow:0 0 ${s*2}px rgba(200,245,90,.55),0 0 ${s*6}px rgba(200,245,90,.18)"></div>`;
// light source position used for shadow direction
function shadow(ex,ey,lx,ly,h){const dx=(ex-lx),dy=(ey-ly),l=Math.hypot(dx,dy)||1;const k=h*0.6;return `${dx/l*k}px ${dy/l*k+h*.3}px ${h*1.6}px rgba(0,0,0,.55)`}
const ink='#EDE6DA',ink2='#C9C0B2';
if(KF==='01'){
 const cx=M?W*.5:W*.67,cy=M?H*.3:H*.5,R=M?W*.25:H*.21,o=R*.6;
 html+=pool(cx,cy,R*3.4,.10);
 [['255,184,107',-90,18],['125,152,255',30,30],['79,209,188',150,10]].forEach(([c,d,h])=>{const a=d*Math.PI/180,x=cx+Math.cos(a)*o,y=cy+Math.sin(a)*o;
  html+=`<div class="vel" style="z-index:${6+h};left:${x-R}px;top:${y-R}px;width:${R*2}px;height:${R*2}px;background:radial-gradient(circle at 40% 35%,rgba(${c},.34),rgba(${c},.20) 70%,rgba(${c},.28));box-shadow:${shadow(x,y,cx,cy,h)},inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(${c},.55)"></div>`});
 html+=bead(cx,cy,M?14:18);
 html+=`<div class="t folio" style="${M?'right:16px;top:60px;font-size:140px':'right:6%;bottom:4%;font-size:300px'}">01</div>`;
 html+=`<div class="t" style="${M?`left:20px;right:20px;bottom:40px`:`left:8%;top:30%;width:40%`}"><div class="mono" style="color:#C8F55A;margin-bottom:${M?14:24}px">Chapter one &nbsp;/&nbsp; Identity</div><h1 class="serif" style="font-size:${M?38:70}px;line-height:1.04;color:${ink}">${cp.h}</h1>
 <div style="width:48px;height:1px;background:rgba(237,230,218,.3);margin:${M?18:30}px 0"></div><p style="font-size:${M?15:17}px;line-height:1.6;color:${ink2};max-width:28em">${cp.s}</p></div>`;
 if(!M)[['Human behaviour',-90],['Business',30],['Technology',150]].forEach(([l,d])=>{const a=d*Math.PI/180,x=cx+Math.cos(a)*(o+R+30),y=cy+Math.sin(a)*(o+R+30);html+=`<div class="t mono" style="left:${x}px;top:${y}px;transform:translate(-50%,-50%);color:${ink2}">${l}</div>`});
}
if(KF==='03'){
 const lx=M?W*.5:W*.62,ly=M?H*.42:H*.5;
 html+=pool(lx,ly+H*.1,W*.6,.07);
 const pw=M?W*1.1:W*.78,ph=M?H*.5:H*.7,px=M?-W*.05:W*.24,py=M?H*.18:H*.22;
 // table plane with two lying cards
 html+=`<div class="stage"><div class="plane" style="left:${px}px;top:${py}px;width:${pw}px;height:${ph}px;transform:rotateX(58deg) rotateZ(-14deg)">
 <div class="card" style="left:${pw*.04}px;top:${ph*.52}px;width:${pw*.36}px;height:${pw*.36*.62}px;transform:rotateZ(6deg);box-shadow:0 30px 40px rgba(0,0,0,.6)"><img src="${COVER('sap-agentic')}"></div>
 <div class="card" style="left:${pw*.6}px;top:${ph*.58}px;width:${pw*.36}px;height:${pw*.36*.62}px;transform:rotateZ(-8deg);box-shadow:0 30px 40px rgba(0,0,0,.6)"><img src="${COVER('airline-app')}"></div>
 </div></div>`;
 // hero card lifted toward camera
 const cw=M?W*.84:W*.44,ch=cw*.62,cxp=M?W*.08:W*.42,cyp=M?H*.14:H*.16;
 html+=`<div style="position:absolute;z-index:7;left:${cxp+cw*.08}px;top:${cyp+ch*1.02}px;width:${cw*.84}px;height:${ch*.18}px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);filter:blur(10px)"></div>
 <div class="card" style="z-index:8;left:${cxp}px;top:${cyp}px;width:${cw}px;height:${ch}px;transform:perspective(1400px) rotateX(6deg) rotateY(-9deg);box-shadow:0 2px 0 rgba(255,255,255,.4) inset,0 50px 80px rgba(0,0,0,.55),0 0 0 1px rgba(200,245,90,.25)"><img src="${COVER('sap-search')}"></div>`;
 html+=`<div class="t" style="${M?`left:20px;right:20px;bottom:36px`:`left:7%;top:18%;width:28%`}"><div class="mono" style="color:#C8F55A;margin-bottom:${M?12:22}px">Chapter three &nbsp;/&nbsp; Selected works</div><h1 class="serif" style="font-size:${M?36:60}px;line-height:1.04;color:${ink}">${cp.h}</h1><p style="margin-top:14px;font-size:${M?14:16}px;line-height:1.6;color:${ink2}">${cp.s}</p>
 <div style="margin-top:${M?18:40}px;padding-top:16px;border-top:1px solid rgba(237,230,218,.16)"><div class="mono">No. 01 &nbsp;${WORKS[0].t}</div><div class="serif" style="font-size:${M?20:26}px;line-height:1.15;margin-top:8px;color:${ink}">${WORKS[0].h}</div>${M?'':'<div style="margin-top:20px"><span class="cta s" style="border-color:rgba(237,230,218,.4);color:#EDE6DA">View case</span></div>'}</div></div>`;
}
if(KF==='05'){
 const cx=M?W*.5:W*.7,cy=M?H*.3:H*.52;
 html+=pool(cx,cy,M?W*.9:W*.45,.09);
 const pw=M?W*1.3:W*.54,ph=pw;
 let tk='';
 const cols=['#E8C79E','#B9C3E8','#A9D9CF','#D9E8B4'];
 for(let p=0;p<8;p++){const a=p/8*Math.PI*2,gx=pw/2+Math.cos(a)*pw*.33,gy=ph/2+Math.sin(a)*ph*.33;
  for(let i=0;i<25;i++){const ga=i*2.399,gr=Math.sqrt(i)*pw*.022;const x=gx+Math.cos(ga)*gr,y=gy+Math.sin(ga)*gr,s=pw*(i==0?.026:.018);
   tk+=`<div class="tok" style="left:${x-s/2}px;top:${y-s/2}px;width:${s}px;height:${s}px;background:radial-gradient(circle at 35% 30%,#FFFFFF,${cols[p%4]} 60%);box-shadow:${s*.25}px ${s*.45}px ${s*.5}px rgba(0,0,0,.55)${i==0?',0 0 0 2px rgba(237,230,218,.25)':''}"></div>`}
  tk+=`<div style="position:absolute;left:${pw/2}px;top:${ph/2}px;width:${pw*.33-pw*.12}px;height:1px;background:rgba(237,230,218,.14);transform-origin:0 0;transform:rotate(${a}rad) translateX(${pw*.06}px)"></div>`}
 html+=`<div class="stage"><div class="plane" style="left:${cx-pw/2}px;top:${cy-ph/2}px;width:${pw}px;height:${ph}px;transform:rotateX(56deg) rotateZ(18deg)">${tk}<div style="position:absolute;left:${pw/2-pw*.02}px;top:${ph/2-pw*.02}px;width:${pw*.04}px;height:${pw*.04}px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F4FFD6,#C8F55A 45%,#7AA800);box-shadow:0 0 30px rgba(200,245,90,.6)"></div></div></div>`;
 html+=`<div class="t" style="${M?`left:20px;right:20px;bottom:40px`:`left:8%;top:22%;width:34%`}"><div class="mono" style="color:#C8F55A;margin-bottom:${M?10:18}px">Chapter five &nbsp;/&nbsp; Building teams</div>
 <div style="display:flex;align-items:baseline;gap:16px"><span class="serif" style="font-size:${M?84:170}px;line-height:.9;color:${ink};letter-spacing:-.03em">200+</span></div><div class="mono" style="margin-top:6px">Designers hired across organisations</div>
 <h1 class="serif" style="font-size:${M?26:36}px;line-height:1.08;color:${ink};margin-top:${M?18:36}px">${cp.h}</h1><p style="margin-top:12px;font-size:${M?14:16}px;line-height:1.6;color:${ink2}">${cp.s}</p></div>`;
}
if(KF==='08'){
 const px=M?W*.18:W*.12,py=M?H*.4:H*.6;
 html+=pool(px,py,W*.5,.10);
 // gathered paper pieces around the point
 const pcs=[['255,184,107',-36,-22,44],['125,152,255',-14,26,52],['79,209,188',30,-6,38]];
 pcs.forEach(([c,dx,dy,s],i)=>{const k=M?.7:1;html+=`<div class="vel" style="z-index:${8+i};left:${px+dx*k-s*k/2}px;top:${py+dy*k-s*k/2}px;width:${s*k}px;height:${s*k}px;background:rgba(${c},.32);box-shadow:${4+i*3}px ${8+i*4}px ${14+i*6}px rgba(0,0,0,.5),inset 0 0 0 1px rgba(${c},.6)"></div>`});
 html+=`<svg style="position:absolute;inset:0;z-index:14" width="${W}" height="${H}"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#C8F55A"/><stop offset=".75" stop-color="#C8F55A" stop-opacity=".8"/><stop offset="1" stop-color="#C8F55A" stop-opacity="0"/></linearGradient></defs>
 <path d="M ${px} ${py} C ${px+W*.25} ${py-H*.02}, ${px+W*.45} ${py+H*.06}, ${W} ${py-H*.04}" stroke="rgba(0,0,0,.5)" stroke-width="3" fill="none" transform="translate(4 10)" style="filter:blur(3px)"/>
 <path d="M ${px} ${py} C ${px+W*.25} ${py-H*.02}, ${px+W*.45} ${py+H*.06}, ${W} ${py-H*.04}" stroke="url(#lg)" stroke-width="1.6" fill="none"/></svg>`;
 html+=bead(px,py,M?14:18);
 html+=`<div class="t" style="${M?`left:20px;right:20px;top:13%`:`left:8%;top:20%;width:60%`}"><div class="mono" style="color:#C8F55A;margin-bottom:${M?12:22}px">Chapter eight &nbsp;/&nbsp; Collaborate</div><h1 class="serif" style="font-size:${M?40:84}px;line-height:1.02;color:${ink}">${cp.h}</h1></div>
 <div class="t" style="${M?`left:20px;right:20px;bottom:40px`:`left:${W*.52}px;top:68%;width:38%`}"><p style="font-size:${M?15:17}px;line-height:1.6;color:${ink2}">${cp.s}</p><div style="display:flex;gap:12px;margin-top:26px;flex-wrap:wrap"><span class="cta p">Start a conversation</span><span class="cta s" style="border-color:rgba(237,230,218,.4);color:#EDE6DA">See all works</span></div></div>`;
}
document.getElementById('root').innerHTML=html;
</script></body></html>
