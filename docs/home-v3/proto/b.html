<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{background:#161616}
.t{position:absolute;z-index:10}
.big{font-family:'Bodoni 72',BodoniModa,serif;font-weight:300;letter-spacing:-.035em;line-height:.9;color:var(--ink)}
.disc{position:absolute;border-radius:50%;mix-blend-mode:screen}
.dot{display:inline-block;border-radius:50%;background:var(--lime);vertical-align:baseline}
.diff{mix-blend-mode:difference;color:#EDEDED}
.idx{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:baseline}
.rule{height:1px;background:rgba(237,237,237,.14)}
</style></head><body><div id="root"></div>
<script src="copy.js"></script><script>
const W=innerWidth,H=innerHeight;let html=HDR+RAIL(+KF);const cp=COPY[KF];
if(KF==='01'){
 const fs=M?60:Math.min(W*.098,150);
 html+=`<div id="fl" style="position:absolute;inset:0;z-index:4"></div><div id="tx" class="t big" style="${M?`left:20px;right:12px;top:15%`:`left:6%;right:4%;top:17%`};font-size:${fs}px">Design is<br>undergoing a<br>profound<br>transformation<span id="ph" class="dot" style="width:${fs*.16}px;height:${fs*.16}px;margin-left:${fs*.04}px;visibility:hidden"></span></div><div id="realdot" style="position:absolute;z-index:12;border-radius:50%;background:#C8F55A;box-shadow:0 0 0 ${fs*.05}px rgba(22,22,22,1)"></div>`;
 window.__after=()=>{const b=document.getElementById('ph').getBoundingClientRect();const px=b.left+b.width/2,py=b.top+b.height/2,r=M?92:fs*.9;
  const d=document.getElementById('realdot');Object.assign(d.style,{left:b.left+'px',top:b.top+'px',width:b.width+'px',height:b.height+'px'});
  let h='';[['#FFB86B',-90],['#7D98FF',30],['#4FD1BC',150]].forEach(([c,dg])=>{const a=dg*Math.PI/180,o=r*.58;h+=`<div class="disc" style="width:${r*2}px;height:${r*2}px;left:${px+Math.cos(a)*o-r}px;top:${py+Math.sin(a)*o-r}px;background:${c};opacity:.78"></div>`});
  [-30,90,210].forEach(dg=>{const a=dg*Math.PI/180,o=r*.58;h+=`<div style="position:absolute;border-radius:50%;border:1px solid rgba(237,237,237,.16);width:${r*2}px;height:${r*2}px;left:${px+Math.cos(a)*o-r}px;top:${py+Math.sin(a)*o-r}px"></div>`});
  document.getElementById('fl').innerHTML=h;
  const tx=document.getElementById('tx'),tb=tx.getBoundingClientRect(),k=tx.cloneNode(true);k.id='';k.style.color='#161616';k.style.zIndex=11;
  let path='';[-90,30,150].forEach(dg=>{const a=dg*Math.PI/180,o=r*.58,cx=px+Math.cos(a)*o-tb.left,cy=py+Math.sin(a)*o-tb.top;path+=`M ${cx-r} ${cy} a ${r} ${r} 0 1 0 ${2*r} 0 a ${r} ${r} 0 1 0 ${-2*r} 0 `});
  k.style.clipPath=`path('${path}')`;tx.parentNode.appendChild(k)};
 html+=`<div class="t" style="${M?`left:20px;right:20px;bottom:40px`:`left:6%;bottom:8%;width:88%;display:grid;grid-template-columns:1fr 1fr 1fr 1.4fr;gap:32px;align-items:end`}">
 ${M?'':`<div><div class="mono" style="color:#FFB86B">Human behaviour</div><div style="margin-top:8px;font-size:15px;color:var(--ink2)">Evolving human behaviour.</div></div><div><div class="mono" style="color:#7D98FF">Business</div><div style="margin-top:8px;font-size:15px;color:var(--ink2)">Changing business ambitions.</div></div><div><div class="mono" style="color:#4FD1BC">Technology</div><div style="margin-top:8px;font-size:15px;color:var(--ink2)">And the technology enabling both.</div></div>`}
 <div>${M?`<p style="font-size:15px;line-height:1.55;color:var(--ink2)">${cp.s.replace('I work','<br><span style="color:var(--ink)">I work').replace('convergence.','convergence.</span>')}</p>`:`<div class="mono" style="color:var(--lime)">The point of convergence</div><div class="serif" style="margin-top:6px;font-size:30px;line-height:1.1">I work at their convergence.</div>`}</div></div>`;
}
if(KF==='03'){
 const fs=M?50:Math.min(W*.072,110);
 const R=M?W*.62:H*.47, cx=M?W*.58:W*.71, cy=M?H*.47:H*.55;
 html+=`<div style="position:absolute;left:${cx-R}px;top:${cy-R}px;width:${R*2}px;height:${R*2}px;border-radius:50%;overflow:hidden;z-index:5;background:#222"><img src="${COVER('sap-search')}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:35% 50%;transform:scale(1.08);transform-origin:30% 45%"></div>
 <div style="position:absolute;left:${cx-R-14}px;top:${cy-R-14}px;width:${R*2+28}px;height:${R*2+28}px;border-radius:50%;border:1px solid rgba(200,245,90,.5);z-index:5"></div>`;
 html+=`<div class="t big" style="${M?`left:20px;right:20px;top:11%`:`left:6%;top:16%;width:40%`};font-size:${fs}px">From possibility<br>to <em style="font-style:italic">practice</em><span class="dot" style="width:${fs*.16}px;height:${fs*.16}px;margin-left:${fs*.03}px"></span></div>`;
 html+=`<div class="t" style="${M?`left:20px;right:20px;bottom:36px`:`left:6%;bottom:9%;width:30%`}"><p style="font-size:${M?14:15}px;line-height:1.55;color:var(--ink2);margin-bottom:${M?16:28}px">${cp.s}</p>
 ${WORKS.map((w,i)=>`<div class="rule"></div><div style="display:flex;gap:18px;align-items:baseline;padding:${M?10:14}px 0;${i?'opacity:.45':''}"><span class="mono" style="${i?'':'color:var(--lime)'}">0${i+1}</span><span class="serif" style="font-size:${M?17:22}px">${w.t}</span>${i||M?'':'<span class="mono" style="margin-left:auto">View case</span>'}</div>`).join('')}<div class="rule"></div></div>`;
}
if(KF==='05'){
 const fs=M?190:Math.min(H*.66,600);
 html+=`<div class="t" style="${M?`left:20px;top:11%`:`left:5%;top:${H*.5-fs*.5}px`};font-family:'Bodoni 72',BodoniModa,serif;font-weight:300;font-size:${fs}px;line-height:1;letter-spacing:-.06em;
 background-image:radial-gradient(circle,#EDEDED ${M?1.6:2.6}px,transparent ${M?2.1:3.2}px);background-size:${M?7:11}px ${M?7:11}px;-webkit-background-clip:text;color:transparent">200</div>
 <div class="t" style="${M?`left:${W*.82}px;top:11%`:`left:${W*.05+fs*1.42}px;top:${H*.5-fs*.5}px`};font-family:'Bodoni 72',BodoniModa,serif;font-size:${fs*.5}px;color:var(--lime);line-height:1.3">+</div>`;
 html+=`<div class="t" style="${M?`left:20px;right:20px;top:${H*.11+190+24}px`:`right:6%;bottom:12%;width:30%`}"><div class="mono" style="color:var(--lime)">Designers hired across organisations</div><h1 class="serif" style="font-size:${M?30:40}px;line-height:1.06;margin-top:16px">${cp.h}</h1><p style="margin-top:14px;font-size:${M?14:16}px;line-height:1.55;color:var(--ink2)">${cp.s}</p></div>`;
}
if(KF==='08'){
 const fs=M?54:Math.min(W*.09,136);
 html+=`<div class="t big" style="${M?`left:20px;right:0;top:14%`:`left:6%;right:0;top:18%`};font-size:${fs}px">The next chapter<br>is still taking<br>shape<span class="dot" style="width:${fs*.16}px;height:${fs*.16}px;margin-left:${fs*.03}px;box-shadow:0 0 24px rgba(200,245,90,.6)"></span><span style="display:inline-block;vertical-align:baseline;height:2px;width:${M?W:W*.7}px;background:linear-gradient(90deg,#C8F55A,rgba(200,245,90,0));margin-left:-2px;transform:translateY(-${fs*.07}px)"></span></div>`;
 html+=`<div class="t" style="${M?`left:20px;right:20px;bottom:40px`:`left:6%;bottom:11%;width:40%`}"><p style="font-size:${M?15:17}px;line-height:1.55;color:var(--ink2)">${cp.s}</p><div style="display:flex;gap:12px;margin-top:28px;flex-wrap:wrap"><span class="cta p">Start a conversation</span><span class="cta s">See all works</span></div></div>`;
}
document.getElementById('root').innerHTML=html;document.fonts.ready.then(()=>window.__after&&window.__after());
</script></body></html>
