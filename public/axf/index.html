<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents People Love and Trust</title>
<meta name="description" content="A hands-on handbook to build agents people love and trust: Frame, Shape, Realise.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE work: a calm, premium field handbook people work in, not read once
   IDEA a working notebook on a transit line: three coloured lines, twelve chapters, one card that fills as you go
   PICTURE the four experience lenses around one enterprise core; the Frame, Shape, Realise route in solid fields
   COLOUR warm white or deep graphite ground, ink, indigo Frame, coral Shape, green Realise
   TYPE Geist 500 tight for display, Geist 400 for text, Geist Mono only for codes and file names
   LAYOUT chapters: rail, then work column; stacks to one column under 1000px */

/* ============ AXF design system: tokens ============ */
:root{color-scheme:light dark;
/* colour: neutrals */
--c-bg:light-dark(#fafaf8,#0d0e11);
--c-surface:light-dark(#ffffff,#15171b);
--c-sunken:light-dark(#f3f3f0,#111317);
--c-ink:light-dark(#111318,#eceef1);
--c-ink-2:light-dark(#4a4f59,#b4b8c0);
--c-ink-3:light-dark(#6c717c,#8b909a);
--c-line:light-dark(#e6e6e1,#262930);
--c-line-strong:light-dark(#cfcfc8,#3a3e47);
/* colour: phases */
--c-frame:#3446eb;--c-frame-ink:#ffffff;--c-frame-tint:light-dark(#eef0fe,#181c3a);
--c-shape:#f26a3d;--c-shape-ink:#160c07;--c-shape-tint:light-dark(#fff1eb,#2e1a12);
--c-realise:#14b37e;--c-realise-ink:#04140d;--c-realise-tint:light-dark(#e8f8f1,#0f2a20);
/* colour: semantics */
--c-ai:light-dark(#3446eb,#8e9bff);
--c-proposal:light-dark(#8a5a00,#f0b452);
--c-ok:light-dark(#0e7a55,#3ad19b);
--c-focus:color-mix(in srgb,#3446eb 50%,transparent);
/* type */
--ff:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
--ff-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
--fs-1:13px;--fs-2:14px;--fs-3:16px;--fs-4:18px;--fs-5:clamp(20px,2vw,22px);--fs-6:clamp(24px,2.8vw,30px);--fs-7:clamp(32px,4.2vw,46px);--fs-8:clamp(38px,5.4vw,60px);
--lh-tight:1.06;--lh-snug:1.25;--lh-body:1.6;
--fw-reg:400;--fw-med:500;--fw-semi:600;
/* space (4pt) */
--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-7:32px;--sp-8:40px;--sp-9:56px;--sp-10:72px;--sp-11:96px;
--gutter:max(5vw,16px);--max:1240px;--read:68ch;
/* shape */
--r-1:6px;--r-2:10px;--r-3:14px;--r-4:20px;--r-pill:999px;
/* elevation */
--e-1:0 1px 2px rgba(17,19,24,.05);
--e-2:0 1px 2px rgba(17,19,24,.04),0 8px 24px -10px rgba(17,19,24,.16);
--e-3:0 2px 4px rgba(17,19,24,.05),0 24px 48px -16px rgba(17,19,24,.24);
/* motion */
--t-fast:140ms;--t-base:220ms;--ease:cubic-bezier(.2,.7,.2,1);
/* control */
--ctl-h:44px;--ctl-h-sm:36px}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}

/* ============ base ============ */
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:88px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--c-bg);color:var(--c-ink);font:var(--fw-reg) var(--fs-3)/var(--lh-body) var(--ff);overflow-x:clip;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
h1,h2,h3,h4{margin:0;font-weight:var(--fw-med);letter-spacing:-.022em;line-height:var(--lh-tight);text-wrap:balance}
h1{font-size:var(--fs-7)}
h2{font-size:var(--fs-6);line-height:1.12}
h3{font-size:var(--fs-4);line-height:var(--lh-snug);letter-spacing:-.012em}
h4{font-size:var(--fs-3);line-height:var(--lh-snug);letter-spacing:-.005em;font-weight:var(--fw-semi)}
p,ul,ol{margin:0}
:focus-visible{outline:none;box-shadow:0 0 0 3px var(--c-focus);border-radius:var(--r-1)}
.mono{font-family:var(--ff-mono);font-size:.92em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ layout primitives ============ */
.wrap{max-width:var(--max);margin:0 auto}
.band{padding:clamp(40px,6vw,88px) var(--gutter)}
.band-s{padding:clamp(28px,4vw,48px) var(--gutter)}
.stack>*+*{margin-top:var(--sp-4)}
.cluster{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center}
.between{display:flex;justify-content:space-between;align-items:end;gap:var(--sp-5);flex-wrap:wrap}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-5)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-5)}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-4)}
.lede{font-size:var(--fs-4);color:var(--c-ink-2);max-width:60ch;line-height:1.55}
.muted{color:var(--c-ink-3)}
.small{font-size:var(--fs-2)}
.xs{font-size:var(--fs-1)}
.over{font-size:var(--fs-2);color:var(--c-ink-3);font-weight:var(--fw-med)}

/* ============ components ============ */
/* button */
.btn{font:var(--fw-med) var(--fs-2)/1 var(--ff);height:var(--ctl-h);padding:0 var(--sp-5);border-radius:var(--r-2);border:1px solid var(--c-line-strong);background:var(--c-surface);color:var(--c-ink);display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.btn:hover{border-color:var(--c-ink-3)}
.btn:active{transform:translateY(1px)}
.btn--primary{background:var(--c-ink);color:var(--c-bg);border-color:var(--c-ink)}
.btn--primary:hover{background:color-mix(in srgb,var(--c-ink) 86%,var(--c-bg));border-color:transparent}
.btn--ghost{border-color:transparent;background:transparent}
.btn--ghost:hover{background:var(--c-sunken);border-color:transparent}
.btn--sm{height:var(--ctl-h-sm);padding:0 var(--sp-3);font-size:var(--fs-1);border-radius:var(--r-1)}
.btn svg{width:16px;height:16px;flex:none}
/* segmented */
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:var(--r-2);background:var(--c-sunken);border:1px solid var(--c-line);flex-wrap:wrap}
.seg button{font:var(--fw-med) var(--fs-1)/1 var(--ff);height:32px;padding:0 var(--sp-3);border:0;border-radius:7px;background:transparent;color:var(--c-ink-3);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--c-ink)}
.seg button[aria-pressed=true]{background:var(--c-surface);color:var(--c-ink);box-shadow:var(--e-1)}
/* chip / badge */
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 var(--sp-3);border-radius:var(--r-pill);border:1px solid var(--c-line);background:var(--c-surface);font-size:var(--fs-1);font-weight:var(--fw-med);color:var(--c-ink-2);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor}
.badge{flex:none;display:inline-flex;align-items:center;height:22px;padding:0 var(--sp-2);border-radius:var(--r-pill);font-size:12px;font-weight:var(--fw-semi);white-space:nowrap}
.badge--frame{background:var(--c-frame);color:var(--c-frame-ink)}
.badge--shape{background:var(--c-shape);color:var(--c-shape-ink)}
.badge--realise{background:var(--c-realise);color:var(--c-realise-ink)}
.badge--soft{background:var(--c-sunken);color:var(--c-ink-2)}
.prop{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:var(--r-pill);border:1px solid currentColor;color:var(--c-proposal);font-size:11px;font-weight:var(--fw-semi);margin-inline-end:6px;vertical-align:1px}
.ai{display:inline-flex;align-items:center;gap:4px;color:var(--c-ai);font-size:12px;font-weight:var(--fw-semi)}
.ai::before{content:"";width:10px;height:10px;background:currentColor;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
/* card / panel */
.card{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-3);box-shadow:var(--e-1)}
.card--pad{padding:var(--sp-6)}
.card--link{display:block;text-decoration:none;transition:border-color var(--t-base) var(--ease),box-shadow var(--t-base) var(--ease),transform var(--t-base) var(--ease)}
.card--link:hover{border-color:var(--c-line-strong);box-shadow:var(--e-2);transform:translateY(-1px)}
.panel{background:var(--c-sunken);border-radius:var(--r-3);padding:var(--sp-5) var(--sp-6)}
.callout{border-radius:var(--r-3);padding:var(--sp-5) var(--sp-6);background:var(--tint,var(--c-sunken));border:1px solid color-mix(in srgb,var(--accent,var(--c-line)) 22%,transparent)}
/* meter */
.meter{height:6px;border-radius:var(--r-pill);background:var(--c-line);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:inherit;background:var(--accent,var(--c-ink));transition:width var(--t-base) var(--ease)}
/* ring */
.ring{--p:0;width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--accent,var(--c-ink)) calc(var(--p)*1%),var(--c-line) 0);display:grid;place-items:center;flex:none}
.ring::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--ring-bg,var(--c-bg))}
.ring.done{background:var(--accent)}
.ring.done::after{width:6px;height:6px;background:var(--ring-bg,var(--c-bg))}
/* tabs */
.tabs{display:flex;gap:var(--sp-1);border-bottom:1px solid var(--c-line);overflow-x:auto;scrollbar-width:none}
.tabs a{flex:none;display:flex;align-items:center;height:var(--ctl-h);padding:0 var(--sp-4);font-size:var(--fs-2);font-weight:var(--fw-med);color:var(--c-ink-3);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--c-ink)}
.tabs a[aria-current=page]{color:var(--c-ink);border-bottom-color:var(--c-ink)}
/* field */
.field{display:grid;gap:6px}
.field label{font-size:var(--fs-2);font-weight:var(--fw-semi)}
.field .hint{font-size:var(--fs-1);color:var(--c-ink-3)}
.input,.area{width:100%;font:var(--fw-reg) var(--fs-3)/1.55 var(--ff);color:var(--c-ink);background:var(--c-surface);border:1px solid var(--c-line-strong);border-radius:var(--r-2);padding:var(--sp-3) var(--sp-4);transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.input{height:var(--ctl-h)}
.area{min-height:88px;resize:vertical;field-sizing:content;max-height:420px}
.input:hover,.area:hover{border-color:var(--c-ink-3)}
.input:focus,.area:focus{outline:none;border-color:var(--c-frame);box-shadow:0 0 0 3px var(--c-focus)}
.input::placeholder,.area::placeholder{color:var(--c-ink-3);opacity:.75}
/* check item */
.checks{list-style:none;padding:0;display:grid;gap:var(--sp-2)}
.check{display:grid;grid-template-columns:24px minmax(0,1fr);gap:var(--sp-3);align-items:start;padding:var(--sp-4);border:1px solid var(--c-line);border-radius:var(--r-2);background:var(--c-surface);cursor:pointer;transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.check:hover{border-color:var(--c-line-strong)}
.check input{appearance:none;margin:1px 0 0;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--c-line-strong);background:var(--c-surface);display:grid;place-items:center;cursor:pointer;transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
.check input::after{content:"";width:10px;height:6px;border-left:2px solid var(--c-bg);border-bottom:2px solid var(--c-bg);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:var(--accent,var(--c-ink));border-color:var(--accent,var(--c-ink))}
.check input:checked::after{opacity:1;border-color:var(--accent-ink,var(--c-bg))}
.check:has(input:checked){background:color-mix(in srgb,var(--accent,var(--c-ink)) 6%,var(--c-surface));border-color:color-mix(in srgb,var(--accent,var(--c-ink)) 35%,var(--c-line))}
.check span{font-size:var(--fs-3)}
.check small{display:block;color:var(--c-ink-3);font-size:var(--fs-1);margin-top:2px}
/* disclosure */
.disc{border-top:1px solid var(--c-line)}
.disc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:var(--sp-3);min-height:64px;padding:var(--sp-3) 0}
.disc>summary::-webkit-details-marker{display:none}
.disc>summary h3{flex:1}
.disc .pm{width:28px;height:28px;border-radius:50%;border:1px solid var(--c-line-strong);display:grid;place-items:center;flex:none;transition:transform var(--t-base) var(--ease)}
.disc[open]>summary .pm{transform:rotate(45deg)}
.disc>summary:hover .pm{border-color:var(--c-ink)}
.disc-b{padding-bottom:var(--sp-6)}
/* list */
.list{list-style:none;padding:0}
.list li{padding:var(--sp-3) 0;border-top:1px solid var(--c-line)}
.list li:first-child{border-top:0}
.list li.p{color:var(--c-ink-2)}
.num{list-style:none;padding:0;counter-reset:n}
.num li{counter-increment:n;display:grid;grid-template-columns:32px minmax(0,1fr);gap:var(--sp-3);padding:var(--sp-3) 0;border-top:1px solid var(--c-line)}
.num li:first-child{border-top:0}
.num li::before{content:counter(n);width:26px;height:26px;border-radius:50%;background:var(--c-sunken);display:grid;place-items:center;font-size:12px;font-weight:var(--fw-semi);color:var(--c-ink-2)}
/* table */
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-2)}
.tbl th{text-align:start;font-size:var(--fs-1);font-weight:var(--fw-semi);color:var(--c-ink-3);padding:var(--sp-2) var(--sp-3) var(--sp-2) 0;border-bottom:1px solid var(--c-line-strong)}
.tbl td{padding:var(--sp-3) var(--sp-3) var(--sp-3) 0;border-bottom:1px solid var(--c-line);vertical-align:top}
.tbl td:first-child{font-weight:var(--fw-med)}
.scroll{overflow-x:auto}
/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--c-ink);color:var(--c-bg);padding:var(--sp-3) var(--sp-5);border-radius:var(--r-pill);font-size:var(--fs-2);font-weight:var(--fw-med);box-shadow:var(--e-3);opacity:0;pointer-events:none;transition:opacity var(--t-base) var(--ease),transform var(--t-base) var(--ease);z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
.copyfall{display:none;margin-top:var(--sp-3)}
.copyfall.on{display:block}

/* ============ chrome ============ */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--c-bg) 90%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--c-line)}
.top .wrap{display:flex;align-items:center;gap:var(--sp-5);padding:var(--sp-2) var(--gutter);min-height:64px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:var(--fw-semi);letter-spacing:-.01em}
.logo svg{width:28px;height:28px}
.logo small{font-weight:var(--fw-reg);color:var(--c-ink-3);font-size:var(--fs-2)}
.nav{display:flex;gap:2px;margin-inline-start:auto}
.nav a{height:36px;display:flex;align-items:center;padding:0 var(--sp-3);border-radius:var(--r-1);font-size:var(--fs-2);font-weight:var(--fw-med);color:var(--c-ink-3);text-decoration:none}
.nav a:hover{color:var(--c-ink);background:var(--c-sunken)}
.nav a[aria-current=page]{color:var(--c-ink);background:var(--c-sunken)}
.depth-ctl{display:flex;align-items:center;gap:var(--sp-2)}
.depth-ctl .xs{color:var(--c-ink-3)}
.foot{border-top:1px solid var(--c-line);color:var(--c-ink-3);font-size:var(--fs-2)}
.foot .wrap{display:flex;justify-content:space-between;gap:var(--sp-5);flex-wrap:wrap}

/* ============ home ============ */
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(32px,5vw,80px);align-items:center}
.hero h1{font-size:var(--fs-8)}
.hero .cluster{margin-top:var(--sp-7)}
.lensfig{position:relative;aspect-ratio:1/1;max-width:520px;width:100%;justify-self:end}
.lensfig .q{position:absolute;width:48.5%;height:48.5%;border-radius:var(--r-4);padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-2)}
.lensfig .q span{max-width:72%}
.lensfig .q2,.lensfig .q4{align-items:flex-end;text-align:end}
.lensfig .q b{font-size:var(--fs-5);font-weight:var(--fw-med);letter-spacing:-.02em}
.lensfig .q span{font-size:var(--fs-2);opacity:.85;line-height:1.4}
.lensfig .q1{top:0;left:0;background:var(--c-frame);color:var(--c-frame-ink)}
.lensfig .q2{top:0;right:0;background:var(--c-ink);color:var(--c-bg)}
.lensfig .q3{bottom:0;left:0;background:var(--c-realise);color:var(--c-realise-ink);flex-direction:column-reverse}
.lensfig .q4{bottom:0;right:0;flex-direction:column-reverse;background:var(--c-shape);color:var(--c-shape-ink)}
.lensfig .core{position:absolute;inset:34%;border-radius:50%;background:var(--c-surface);box-shadow:var(--e-3);display:grid;place-items:center;text-align:center;padding:var(--sp-4);font-size:var(--fs-2);font-weight:var(--fw-med);line-height:1.3;border:1px solid var(--c-line)}
.lensfig .core small{display:block;font-weight:var(--fw-reg);color:var(--c-ink-3);font-size:12px;margin-top:4px}
.depthpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-4)}
.dopt{text-align:start;display:grid;gap:var(--sp-2);padding:var(--sp-6);border-radius:var(--r-3);border:1px solid var(--c-line);background:var(--c-surface);cursor:pointer;font:inherit;color:inherit;transition:border-color var(--t-base) var(--ease),box-shadow var(--t-base) var(--ease)}
.dopt:hover{border-color:var(--c-line-strong)}
.dopt[aria-pressed=true]{border-color:var(--c-ink);box-shadow:inset 0 0 0 1px var(--c-ink)}
.dopt .between{align-items:center}
.dopt b{font-size:var(--fs-5);font-weight:var(--fw-med);letter-spacing:-.02em}
.dopt p{color:var(--c-ink-2);font-size:var(--fs-2)}
.route{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.line{padding:var(--sp-8) var(--sp-6) var(--sp-9);position:relative}
.line:first-child{padding-inline-start:var(--gutter)}
.line:last-child{padding-inline-end:var(--gutter)}
.line.frame{background:var(--c-frame);color:var(--c-frame-ink)}
.line.shape{background:var(--c-shape);color:var(--c-shape-ink)}
.line.realise{background:var(--c-realise);color:var(--c-realise-ink)}
.line h2{font-size:clamp(30px,3.6vw,44px)}
.line h2 a{text-decoration:none}
.line>p{margin-top:var(--sp-2);opacity:.92;max-width:34ch;min-height:3.2em}
.stops{list-style:none;margin:var(--sp-6) 0 0;padding:0;position:relative}
.stops::before{content:"";position:absolute;left:12px;top:18px;bottom:18px;width:3px;border-radius:2px;background:currentColor;opacity:.3}
.stops a{display:flex;align-items:center;gap:var(--sp-3);min-height:44px;text-decoration:none;font-weight:var(--fw-med)}
.stops a:hover .lb{text-decoration:underline}
.stop{position:relative;z-index:1;flex:none;width:27px;height:27px;border-radius:50%;border:2.5px solid currentColor;display:grid;place-items:center;font-size:12px;font-weight:var(--fw-semi)}
.line.frame .stop{background:var(--c-frame)}.line.shape .stop{background:var(--c-shape)}.line.realise .stop{background:var(--c-realise)}
.stop.done::after{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.loop{display:flex;gap:var(--sp-3);align-items:center;padding:var(--sp-3) var(--gutter);background:var(--c-sunken);font-size:var(--fs-2);color:var(--c-ink-2);flex-wrap:wrap}
.loop svg{width:44px;height:20px;color:var(--c-realise);flex:none}

/* ============ tools ============ */

/* reframe studio */

.crit .seg button{height:26px;padding:0 var(--sp-2);font-size:12px}

/* ============ examples & solutions ============ */
.xhead .grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--sp-8);align-items:end}

.phase-h{display:flex;align-items:baseline;gap:var(--sp-3);margin:var(--sp-9) 0 var(--sp-2);padding-bottom:var(--sp-3);border-bottom:3px solid var(--pc);flex-wrap:wrap}

.jrow .list{padding:0 0 var(--sp-5) 52px;font-size:var(--fs-2)}
.flow{display:flex;gap:3px;flex-wrap:wrap;margin-top:var(--sp-5)}
.flow div{flex:1 1 120px;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-2);background:var(--c-sunken);font-size:var(--fs-2)}

.mock{overflow:hidden;margin-top:var(--sp-5)}
.mbar{display:flex;gap:var(--sp-3);align-items:center;padding:var(--sp-3) var(--sp-5);border-bottom:1px solid var(--c-line);font-size:var(--fs-2);flex-wrap:wrap}
.mbar .sp{margin-inline-start:auto;font-size:var(--fs-1);color:var(--c-ink-3)}
.mgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.mgrid>div{padding:var(--sp-5)}

.mt{width:100%;border-collapse:collapse;font-size:var(--fs-1)}

.lnk{color:var(--c-ai);font-weight:var(--fw-med)}
.nba{margin-top:var(--sp-3);padding:var(--sp-4);border-radius:var(--r-2);background:var(--c-surface);border:1px solid var(--c-line);font-size:var(--fs-1)}
.nba b{display:block;font-size:var(--fs-2);font-weight:var(--fw-semi);margin:4px 0}
.mbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--sp-3)}

.dsteps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding:var(--sp-3) var(--sp-5);border-bottom:1px solid var(--c-line)}

.mcap{font-size:var(--fs-1);color:var(--c-ink-3);padding:var(--sp-3) var(--sp-5);border-top:1px solid var(--c-line)}
.decs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-6) var(--sp-7);margin-top:var(--sp-6)}

/* ============ toolkit ============ */
.tcard>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:var(--sp-3);align-items:center;padding:var(--sp-5) var(--sp-6)}

.typescale div{display:grid;grid-template-columns:90px minmax(0,1fr);gap:var(--sp-4);align-items:baseline;padding:var(--sp-3) 0;border-top:1px solid var(--c-line)}
.spacescale{display:grid;gap:6px}
.spacescale div{display:grid;grid-template-columns:90px minmax(0,1fr);gap:var(--sp-4);align-items:center;font-size:var(--fs-1)}
.spacescale i{display:block;height:10px;background:var(--c-frame);border-radius:3px}

/* ============ handbook cover ============ */
.cover-phase{padding:var(--sp-6)}
.cover-phase .row{display:flex;justify-content:space-between;gap:var(--sp-3);align-items:center;padding:var(--sp-3) 0;border-top:1px solid var(--c-line);text-decoration:none;font-size:var(--fs-2)}
.cover-phase .row:hover .lb{text-decoration:underline}
.cover-phase .row:first-of-type{border-top:0}
.out pre{white-space:pre-wrap;font:var(--fw-reg) var(--fs-2)/1.55 var(--ff);margin:var(--sp-1) 0 0;color:var(--c-ink-2)}
.empty{font-size:var(--fs-2);color:var(--c-ink-3)}

.view{animation:in var(--t-base) var(--ease)}

@media (prefers-reduced-motion:reduce){.view{animation:none}*,*::before,*::after{transition:none!important}}

@media(max-width:1000px){.ch{grid-template-columns:minmax(0,1fr)}.crail{display:none}.crail-sel{display:block;margin-bottom:var(--sp-6)}.hero .wrap,.xhead .grid,.mgrid{grid-template-columns:minmax(0,1fr)}.lensfig{justify-self:start;max-width:440px}.g3{grid-template-columns:minmax(0,1fr)}.mgrid>div+div{border-inline-start:0;border-top:1px solid var(--c-line)}.rf-q{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.lensfig .q span{display:none}.lensfig .core{inset:30%;font-size:12px}.lensfig .core small{display:none}.top .wrap{gap:var(--sp-2)}.nav{order:3;width:100%;margin:0;overflow-x:auto}.nav a{flex:none}.depth-ctl{margin-inline-start:auto}.depth-ctl .xs{display:none}.route{grid-template-columns:minmax(0,1fr)}.line,.line:first-child,.line:last-child{padding-inline:var(--gutter)}.line>p{min-height:0}.router,.g2,.depthpick,.tips,.bar-grid,.rf-out,.decs,.fails,.pn{grid-template-columns:minmax(0,1fr)}.pn .nx{text-align:start}.arch{grid-template-columns:repeat(2,minmax(0,1fr))}.ladder{grid-template-columns:minmax(0,1fr)}.rf-line{grid-template-columns:minmax(0,1fr)}.dsteps{grid-template-columns:repeat(4,minmax(0,1fr))}.figjam{grid-template-columns:minmax(0,1fr)}.jrow .list{padding-inline-start:0}.g4{grid-template-columns:minmax(0,1fr)}}
</style>

<script>
{

/* ---------- tools ---------- */
const LEVL=[['0','Inform','Reads and shows. The person does everything.',['Show the source data clearly']],['1','Suggest','Proposes; the person decides and acts.',['Accept and dismiss on every suggestion','Reasons visible']],['2','Act on approval','Prepares the action; the person approves each one.',['Exact preview: what, to whom, can it be undone','Approval enforced in code','Log every approval']],['3','Act and report','Acts within limits; the person reviews and can undo.',['Readable activity log','Undo window','Per-run limits and exception alerts']],['4','Act alone','Acts and reports only exceptions.',['Monitoring and sampled reviews','Kill switch with a named owner','Auto-pause on anomalies']]];
const ROUTES=[['Log it','Recheck on the next observation. No work created.'],['Act and report','Create the work automatically, marked as AI output. Sample a share for review.'],['Prepare, then ask','Prepare everything with evidence and wait for a person to approve.'],['Human review','A person looks at the evidence before anything is created.'],['Escalate now','Alert a named person immediately, whatever the confidence.']];
const rtEval=a=>a.sev===3?4:a.conf===0?(a.sev===0?0:3):a.sev===2?(a.conf===2?2:3):a.conf===2?1:(a.sev===0?1:2);
function auEval(a){let lv=Math.min([4,3,2,1,1][a.impact+a.undo],[2,3,4][a.ev]);if(a.undo===2)lv=Math.min(lv,2);if(a.impact===2&&a.ev<2)lv=Math.min(lv,1);return lv}
function acEval(a){if(a.rule==='y')return ['Start with a rule or a form','Most cases fit fixed logic. Add AI later for the exceptions that matter.',['Cheap, fast and fully testable','Keeps the agent for steps that need it']];if(a.multi==='y'&&a.path==='y')return a.undo==='y'?['An agent fits this step','It plans and adapts across tools, and mistakes can be caught.',['Set autonomy per action next','Show a plan preview and progress','Log every tool call']]:['An agent, on a short leash','Mistakes cannot be caught before they land: keep it at suggest or act on approval.',['Autonomy level 1 or 2 only','An approval gate before every action','Stage changes as drafts']];if(a.messy==='y')return ['Generation fits this step','Draft, summarise or extract from messy input, with a person reviewing.',['Make every output editable','Show the source it came from']];return ['Prediction or rule','Classify, rank or score with clear thresholds. No agent needed.',['Set and test thresholds','Show confidence where people act on it']]}
const segRow=(attr,key,label,opts,val)=>`<div class="qrow"><span>${label}</span><span class="seg" role="group" aria-label="${label}">${opts.map((o,i)=>`<button type="button" data-${attr}="${key}" data-v="${typeof o==='string'?i:o[0]}" aria-pressed="${(typeof o==='string'?i:o[0])===val}">${typeof o==='string'?o:o[1]}</button>`).join('')}</span></div>`;

 else if(h==='handbook'||h==='card'){html=cover();bind=bindCover;nk='handbook'}
 else if(PH[h])html=phasePage(h);
 else if(h==='examples'){html=examplesPage();nk='examples'}
 else if(h.startsWith('case-')&&CASES[h.slice(5)]){const id=h.slice(5);html=casePage(id,'j');bind=()=>bindCase(id);nk='examples'}
 else if(h.startsWith('solution-')&&CASES[h.slice(9)]){html=casePage(h.slice(9),'s');nk='examples'}
 else if(h==='kit'||h.startsWith('kit-')){const t=KT.some(k=>'kit-'+k[0]===h)?h.slice(4):'tools';html=kitPage(t);bind=bindKit;nk='kit'}
 else if(h==='guardrails'){html=guardPage();bind=bindGuard;nk='guardrails'}
 else html=home();
 const y=window.scrollY;
 app.innerHTML=`<div class="${anim===false?'':'view'}">${html}</div>`;
 document.querySelectorAll('#nav a').forEach(a=>a.getAttribute('href')==='#'+nk?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 app.querySelectorAll('[data-setdepth]').forEach(b=>b.addEventListener('click',()=>setDepth(+b.dataset.setdepth)));
 if(bind)bind();
 if(anim===false)window.scrollTo(0,y);
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
paintDepth();render();
}
</script>
</body>
</html>
