<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
<style>:root{
  --bg:#0F1013;--s1:#181A1F;--s2:#22252B;--s3:#2C3038;

}

  --bg:#F5F6F7;--s1:#FFFFFF;--s2:#EEF0F2;--s3:#E4E7EB;--ink:#0F1013;--ink2:#3A3E46;--ink3:#4D525C;--faint:#9AA0A9;
  --signal-ink:#3F6B00;--on-seg:#FFFFFF;--link:#3654E0;--line:rgba(15,16,19,.10);--line2:rgba(15,16,19,.16);--ctl:rgba(15,16,19,.45);
  --c-des:#B8650A;--c-res:#8A4DB5;--c-lead:#0C8A78;--c-mgr:#5E9A00;--c-p4:#3654E0;--shadow:0 24px 48px rgba(15,16,19,.12);color-scheme:light}}

  --bg:#F5F6F7;--s1:#FFFFFF;--s2:#EEF0F2;--s3:#E4E7EB;--ink:#0F1013;--ink2:#3A3E46;--ink3:#4D525C;--faint:#9AA0A9;
  --signal-ink:#3F6B00;--on-seg:#FFFFFF;--link:#3654E0;--line:rgba(15,16,19,.10);--line2:rgba(15,16,19,.16);--ctl:rgba(15,16,19,.45);
  --c-des:#B8650A;--c-res:#8A4DB5;--c-lead:#0C8A78;--c-mgr:#5E9A00;--c-p4:#3654E0;--shadow:0 24px 48px rgba(15,16,19,.12);color-scheme:light}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin:0}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3,h4{margin:0;font-weight:400;text-wrap:balance}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.over{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
a{color:var(--link)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
/* hero */
.hero{padding:56px 0 40px}
.hero h1{font-family:var(--serif);font-size:clamp(2.6rem,7vw,5.6rem);line-height:1.02;letter-spacing:-.02em;margin:18px 0 22px;max-width:15ch}
.hero p.lead{font-size:clamp(1.05rem,1.6vw,1.3rem);color:var(--ink2);max-width:46rem;font-weight:300}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin-top:40px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.kpi{padding:20px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(2rem,4vw,3.2rem);line-height:1}
.kpi span{display:block;margin-top:8px;font-size:13px;color:var(--ink3)}
.note{margin-top:22px;padding:14px 16px;border:1px solid var(--line2);border-radius:10px;background:var(--s1);color:var(--ink2);font-size:14px;max-width:52rem}
/* filter bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(15,16,19,.94);background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar select,.bar input{background:var(--s2);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px;min-width:0;max-width:100%}
.bar input{flex:1 1 150px}
.chip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:hover{border-color:var(--ctl)}
.count{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-left:auto}
.nav{display:flex;gap:6px;flex-wrap:wrap;padding:14px 0 0}
/* chapters */
.ch{padding:72px 0 8px;border-top:1px solid var(--line);margin-top:56px;scroll-margin-top:90px}
.ch h2{font-family:var(--serif);font-size:clamp(1.9rem,4.4vw,3.4rem);line-height:1.08;letter-spacing:-.015em;margin:12px 0 16px;max-width:20ch}
.ch .story{max-width:44rem;color:var(--ink2);font-size:1.05rem;font-weight:300}
.ch .story p{margin:0 0 12px}
.take{margin:26px 0 0;padding:16px 18px;border-left:3px solid var(--signal);background:var(--s1);border-radius:0 10px 10px 0;max-width:46rem}
.take b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--signal-ink);display:block;margin-bottom:4px}
.fig{margin:36px 0 0;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:20px 18px 16px;min-width:0}
.fig h3{font-size:1.15rem;font-weight:500;margin-bottom:4px}
.fig .sub{font-size:14px;color:var(--ink3);margin:0 0 14px;max-width:46rem}
.fig .foot{font-size:12.5px;color:var(--ink3);margin-top:12px;max-width:50rem}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--sans);fill:var(--ink3);font-size:11px}
svg .t-ink{fill:var(--ink)} svg .t-ink2{fill:var(--ink2)}
svg .mono{font-family:var(--mono);font-size:10px}
.grid-line{stroke:var(--line);stroke-width:1}
.hit{cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 12px;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);margin-right:6px}
.tag.fact{border-color:var(--ink3)} .tag.calc{border-color:var(--c-lead);color:var(--c-lead)} .tag.inf{border-color:var(--c-des);color:var(--c-des)} .tag.hyp{border-color:var(--c-res);color:var(--c-res)}
/* insights */
.ins{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px;margin-top:18px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h4{font-family:var(--serif);font-size:1.3rem;line-height:1.2}
.card p{margin:0;font-size:14.5px;color:var(--ink2)}
.card .why{color:var(--ink3);font-size:13.5px}
.card .ev{font-family:var(--mono);font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line);padding-top:10px}
.card .cav{font-size:13px;color:var(--ink3)}
.card button.go{align-self:flex-start;background:transparent;border:1px solid var(--line2);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--ink2)}
.card button.go:hover{border-color:var(--ctl)}
.card .meta{display:flex;flex-wrap:wrap;gap:4px}
/* table */
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;position:sticky;top:0;background:var(--s1)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer} tr.row:hover td{background:var(--s2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.und{color:var(--ink3);font-style:italic}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--s1);border-left:1px solid var(--line2);box-shadow:var(--shadow);z-index:50;transform:translateX(105%);transition:transform .25s ease;overflow:auto;padding:22px 20px max(28px,env(safe-area-inset-bottom,0px))}
.drawer.open{transform:none}
.drawer h3{font-family:var(--serif);font-size:1.9rem;line-height:1.1;margin:8px 0 14px}
.drawer dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:0;font-size:14px}
.drawer dt{color:var(--ink3)} .drawer dd{margin:0;color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 16px}
.acts span{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2)}
.acts .y{background:var(--signal);color:var(--on-signal);border-color:var(--signal)}
.acts .n{color:var(--ink3)} .acts .u{color:var(--ink3);border-style:dashed}
.x{position:absolute;top:14px;right:14px;background:var(--s2);border:1px solid var(--line2);border-radius:8px;width:34px;height:34px}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--s2);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;font-size:12.5px;color:var(--ink);max-width:260px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s}
#tip b{display:block;font-weight:500;margin-bottom:2px}
#tip span{color:var(--ink3);display:block}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.scrim.on{display:block}
.btn{background:var(--signal);color:var(--on-signal);border:0;border-radius:8px;padding:8px 14px;font-weight:500}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--ctl)}
details{border-top:1px solid var(--line);padding:12px 0}
details summary{cursor:pointer;color:var(--ink2)}
footer{padding:48px 0 64px;margin-top:64px;border-top:1px solid var(--line);color:var(--ink3);font-size:13px}
@media (max-width:640px){.drawer dl{grid-template-columns:100px 1fr}.fig{padding:14px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.card .ch-top{display:flex;gap:10px;align-items:flex-start}
.card .ib{flex:none;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--lime,#C8F55A) 16%,var(--s1));display:grid;place-items:center;border:1px solid var(--line2)}
.card .ico{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card .qq{font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--ink2)}
.card .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .big b{font-family:var(--serif);font-size:2.6rem;line-height:1;color:var(--ink);font-weight:500}
.card .big span{font-size:13px;color:var(--ink3);flex:1;min-width:120px}
.card.hero{border-color:var(--line2)}
.viz{display:flex;flex-direction:column;gap:6px}
.viz .vl{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.viz svg.vb{width:100%;max-width:240px;height:48px}.viz svg.vb2{width:100%;max-width:300px}
.viz .on{fill:var(--ink)}.viz .off{fill:var(--line2)}
.viz .bt{font:9px var(--mono);fill:var(--ink3)}
.dg{display:flex;flex-wrap:wrap;gap:4px}.dg i{width:10px;height:10px;border-radius:50%;background:var(--line2)}.dg i.on{background:var(--ink)}
.rt{display:flex;flex-direction:column;gap:4px}.rr{display:flex;align-items:center;gap:8px}.rr svg.st{width:64px;height:12px;fill:var(--ink);flex:none}.rr b{height:8px;border-radius:4px;background:var(--ink);display:block}.rr em{font:11px var(--mono);color:var(--ink3);font-style:normal}

.dyn{font-size:13.5px;color:var(--ink2);margin:12px 0 0;max-width:52rem}
.dbmodal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:grid;place-items:center;padding:16px}
.dbcard{background:var(--s1);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:20px;width:min(860px,100%);max-height:92vh;overflow:auto}
.dbcard h3{font-family:var(--serif);font-size:1.4rem;margin-bottom:12px}

.top{border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px));font-size:14px}.top .wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--ink3)}.top a{color:var(--ink2);text-decoration:none}.top a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}

/* ---- type: the same tokens and weights as the rest of the site ---- */
:root{
  --sans:"Geist Variable","Geist",ui-sans-serif,system-ui,sans-serif;
  --serif:"Bodoni 72","Bodoni Moda Variable","Bodoni Moda",Didot,"Bodoni MT",Georgia,serif;
  --mono:"Geist Mono Variable","Geist Mono",ui-monospace,"SFMono-Regular",monospace;
  --fs-d-l:clamp(2.125rem,4.8vw,4.25rem);--fs-heading:clamp(1.5rem,3vw,2.5rem);--fs-title:clamp(1.25rem,2vw,1.625rem);
  --fs-body-lg:clamp(1.125rem,1.5vw,1.25rem);--fs-body:clamp(1rem,1.3vw,1.0625rem);--fs-figure:clamp(1.5rem,2.5vw,2rem);
  --track-d-l:-.035em;--track-title:-.02em;--track-tight:-.03em;--track-body:-.005em;--track-overline:.08em;--track-label:.06em}
body{font-family:var(--sans);font-size:var(--fs-body);font-weight:400;line-height:1.7}
h1,h2,h3,h4,.serif{font-family:var(--serif)}
.over{font-size:.75rem;letter-spacing:var(--track-overline)}
.lab{letter-spacing:var(--track-label)}
.hero{padding:40px 0 28px}
.hero h1{font-size:var(--fs-d-l);font-weight:200;letter-spacing:var(--track-d-l);line-height:1.05;max-width:18ch;margin:14px 0 12px}
.hero p.lead{font-size:var(--fs-body-lg);font-weight:300;line-height:1.6;letter-spacing:var(--track-body);max-width:40rem;margin:0}
.ch h2{font-size:var(--fs-d-l);font-weight:200;letter-spacing:var(--track-d-l);line-height:1.05}
.ch .story{font-size:var(--fs-body-lg);font-weight:300;line-height:1.6;letter-spacing:var(--track-body)}
.fig h3{font-family:var(--serif);font-size:var(--fs-title);font-weight:300;letter-spacing:var(--track-title);line-height:1.25}
.card h4{font-size:var(--fs-title);font-weight:300;letter-spacing:var(--track-title);line-height:1.25}
.drawer h3,.dbcard h3{font-weight:300;letter-spacing:var(--track-title)}
.kpi b{font-size:var(--fs-figure);font-weight:400;letter-spacing:var(--track-title)}
.card .big b{font-weight:400}
/* ---- hero: the river leads ---- */
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 14px}
.chip{transition:border-color .16s,background .16s,transform .16s}
.chip:hover{transform:translateY(-1px)}
.rolechip{display:inline-flex;align-items:center;gap:8px}
.rolechip .sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.rolechip[aria-pressed=true] .sw{background:var(--bg)!important}
.playchip{border-color:var(--signal-ink);color:var(--signal-ink)}
.river-fig{margin:0;padding:16px 16px 10px}
.river-fig .cap{margin:6px 4px 2px;min-height:1.6em;font-family:var(--mono);font-size:12px;letter-spacing:var(--track-label);color:var(--ink2)}
svg .band{cursor:pointer;transition:opacity .25s}
svg.river:has(.band:hover) .band:not(:hover){opacity:.28!important}
@keyframes riverIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.river-in{animation:riverIn 1.6s cubic-bezier(.16,1,.3,1) both}
.kpis{margin-top:18px}.kpi{padding:14px 16px}.kpi span{margin-top:4px}
.nav{padding-top:16px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.nav .chip{white-space:nowrap;flex:none}
circle.hit,rect.hit[role=button]{transform-box:fill-box;transform-origin:center;transition:transform .15s}
circle.hit:hover,rect.hit[role=button]:hover{transform:scale(1.35)}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.river-in{animation:none!important}.rv{opacity:1;transform:none}}

/* ---- insight explorer: one serif for titles, Geist for reading, mono only for small labels ---- */
.ix{padding:28px}
.ix-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.ix-head .sub{margin:8px 0 0;font-size:var(--fs-body);color:var(--ink2);max-width:40rem}
.ix-head .count{margin-left:0;padding-top:6px}
.ix-filters{display:flex;flex-direction:column;gap:12px;margin:24px 0 28px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.flt{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:start}
.flt .lab{padding-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip.sm{padding:5px 12px;font-size:13px;line-height:1.4}
.ix-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:20px;margin-top:0}
.ic{background:var(--s1);border:1px solid var(--line2);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:20px;min-width:0}
.ic-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;font-family:var(--mono);font-size:11px;letter-spacing:var(--track-label);text-transform:uppercase}
.ic-kind{display:inline-flex;align-items:center;gap:8px;color:var(--ink);white-space:nowrap}
.ic-kind i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.ic-cat{color:var(--ink3);text-align:right;margin-left:auto}
.ic-head{display:flex;flex-direction:column;gap:8px}
.ic-q{margin:0;font-size:14px;color:var(--ink3);line-height:1.5}
.ic h4{font-family:var(--serif);font-size:var(--fs-title);font-weight:300;letter-spacing:var(--track-title);line-height:1.25;color:var(--ink)}
.ic-big{display:flex;flex-direction:column;gap:6px}
.ic-big b{font-family:var(--serif);font-size:var(--fs-figure);font-weight:400;letter-spacing:var(--track-title);line-height:1;color:var(--ink)}
.ic-big span{font-size:14px;color:var(--ink2);line-height:1.5}
.ic .viz{gap:10px;padding:16px;background:var(--s2);border-radius:10px}
.ic .viz .vl{font-family:var(--sans);font-size:12.5px;color:var(--ink3)}
.ic .viz svg.vb{width:100%;max-width:none;height:auto;max-height:64px}
.ic .viz .on{fill:var(--signal)}.ic .viz .off{fill:var(--s3)}
.ic .viz .bt{font:11px var(--mono);fill:var(--ink3)}
.dg{gap:5px}.dg i{width:8px;height:8px;background:var(--s3)}.dg i.on{background:var(--signal)}
.hb{display:flex;flex-direction:column;gap:8px}

.ic-more summary{font-size:13px;color:var(--ink2)}

.access .cta{display:inline-flex;align-items:center;gap:8px;background:var(--signal);color:var(--on-signal);border-radius:8px;padding:12px 22px;font-weight:500;text-decoration:none}
.access .cta:hover{filter:brightness(1.08)}

  `2014 breaks the pattern: ${S.y(2014).length} projects, four of them one- to two-week research-and-design sprints, and the first Design Lead role. Then the scale changes. Cloud, Networking & DevOps project 1 (2015, 21 months) and Cloud, Networking & DevOps project 2 (2017, 20 months) are the longest builds in the record, with teams of 4 and 6, both in cloud and infrastructure software.`,
  `By 2017 a DesignOps effort for a team of 15+ appears, and design systems and usability testing both enter the record in ${S.firstOf('Design system')}. The work stops being about screens and starts being about how design is done.`],
  [fig('bub','Duration, team size and breadth','Each bubble is a project. Position: duration and team size. Size: how many of the 12 activities were done (dashed rings: activities not fully recorded). Colour: role.','Log scales. Click a bubble to open the project.',A.bubble),
   fig('vel','Work cadence by year','Projects in flight each year: solid for projects that started that year, faded for earlier projects still running (estimated from duration, assuming a January start). Three small charts show median duration, median team size and rating coverage.','There are no start or end dates, so "in flight" is a minimum estimate from duration, and the true overlap is unknown. More projects is not more productivity.',A.velocity),
   fig('strip','How long engagements last, by role','Every project as a dot on a log time axis, spread vertically so none hide behind another. The line marks the median.','Many projects share the same duration, so dots are spread vertically to stay visible. Counts per role are shown at the left.',A.strip)],
  `Length of engagement did not trend upward (rank correlation of year and duration ${f2(S.rYearDur.r)}). What changed was the mix: a few very long platform builds sit beside many short engagements.`);
const c3=chapter('c3','Chapter 3','From designer to design leader',[
  `Median team size by phase runs ${S.phs.map(x=>f1(x.team)).join(', ')} (2011 to 2013, 2014 to 2015, 2017 to 2019, 2020 to 2022, 2023 to 2024); the 2017 to 2019 figure is lifted by the 15+ DesignOps team, and 2023 to 2024 is the highest. Year and team size correlate at ${f2(S.rYearTeam.r)}. In the manager years design-system work and usability testing become routine: usability testing is recorded in ${S.utBy('Design Manager')[0]} of ${S.utBy('Design Manager')[1]} manager projects against ${S.utBy('UX / UI Designer')[0]} of ${S.utBy('UX / UI Designer')[1]} designer projects.`,
  `That is evidence for a move from designing individual experiences to shaping practice and systems. The alternative explanation is that larger teams simply log more activities. The data cannot separate the two; it would take a field for personal contribution.`],
  [fig('pm','Phase small multiples','The same seven measures for each phase (A to E, left to right). Hover for the denominator.','Percentages use only projects where the activity was recorded. Phase E has few fully recorded projects; check n in the tooltip.',A.phaseMulti),
   fig('pc','What sets leadership projects apart','Each line is a project across six measures. Drag on any axis to select a range, for example Design Manager on the Role axis, and compare the selection with the rest.','Lines break where a value was not recorded.',A.parallel),
   fig('sank','What each role worked on','Flow from role to type of work to product type. Hover a band to see the projects.','Type of work groups the "Core theme" values; "HE" and "CSH" are shown as recorded because the workbook does not expand them.',A.sankey)],
  `The leadership shift is visible in team scale and in validation and systems work. Ratings are shown within each phase panel above; they only run from 3 to 5 stars and most recent projects are unrated, so they are not safe to read as a trend.`);
const c4=chapter('c4','Chapter 4','The professional DNA',[
  `Five activities appear in more than three-quarters of recorded projects: research, stakeholder collaboration, journeys and flows, wireframes and visual design. That is the signature core. What differs by phase is what gets added on top.`,
  `Frequency is not proficiency. This chapter shows what was done, not how well, and the Skills sheet holds only one scored entry.`],
  [fig('cap','Capability evolution matrix','Share of recorded projects in each phase where an activity was done. Dashed cells: not recorded for any project in that phase.','n is the number of projects with that activity recorded. Content strategy is left out (recorded for only 12 projects).',A.capab),
   fig('bump','How the mix changed: rankings by phase','Rank of industries, activities or themes in each phase. Lines that climb are growing in prominence; lines that fall are fading.','Ranks rest on small counts per phase; read direction, not exact positions.',A.bump),
   fig('coo','Which activities appear together','The pairs that go together most and least often, compared with chance (lift 1.0 = as expected). Most pairs sit near chance; only a few stand out.','Needs at least 15 projects with both activities recorded. Descriptive only.',A.cooc),
   fig('ups','Signature working patterns (UpSet plot)','Each column is one exact combination of eight core activities; the bar is how many projects share it. A better view than a Venn diagram when sets overlap this much.','Only projects with all eight activities recorded are included.',A.upset),
   fig('chd','Chord diagram: what connects to what','Ribbons link industries, roles or product types to the activities and themes they share. Wider means more projects.','Industries with only one project are left out of the first view.',A.chord),
   h('div',{},fig('rad','Career fingerprint','Six skill dimensions per phase. Toggle phases to compare. Hover a point for what it is based on.','The workbook records activities, not skills, so each dimension is a proxy built from the closest recorded activities; the table lists what is not recorded. Phase E rests on very few fully recorded projects.',A.radar),
     fig('gal','Professional galaxy','Roles, industries, activities and projects as one network. Size shows betweenness centrality, a measure of how much a node connects otherwise separate parts, not how often it appears.','Positions come from a force layout and carry no meaning on their own; the table below ranks the real metrics.',A.galaxy))],
  `The signature is research-led full-stack UX with stakeholders at the table, to which validation and design systems are added later in the career.`);
const c5=chapter('c5','Chapter 5','The hidden stories',[`These are the findings that a project count would never show. Each card says what the evidence is and what would change the conclusion. Filter by how certain a finding is or by how surprising it feels.`],
  [fig('vor','Career landscape (Voronoi treemap)','Every project is a cell, grouped by industry. Size follows duration, team size or equal weight; colour is role. Industries run left to right by their average year.','Cells are computed by a weighted Voronoi layout, so sizes are approximate (within a few per cent).',A.voronoi),h('div',{id:'insx'})],null);
const c6=chapter('c6','Chapter 6','The next frontier',[
  `Everything here is a hypothesis. It reads the record forward: where the accumulated mix looks unusual, and what the workbook would need to confirm it.`],
  [h('div',{class:'ins',id:'next'})],`If the AI era needs designers who can direct teams, systems and research together in complex enterprise products, the record is consistent with that direction. It cannot show outcomes, so the case still needs the impact stories the workbook leaves empty.`);

const ICO={layers:'<path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/><path d="m3 17 9 5 9-5" opacity=".5"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 2.5-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M17 14c2.5 0 4 2 4 5"/>',star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3Z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',trend:'<path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/>',blocks:'<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5" stroke-dasharray="2 2"/>',handshake:'<path d="M3 12l4-4 4 2 3-2 4 3 3-1"/><path d="m7 8 3 8 3 1 4-5"/>',bolt:'<path d="M13 3 5 14h6l-1 7 8-11h-6l1-7Z"/>',flag:'<path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/>',scatter:'<circle cx="6" cy="17" r="1.6"/><circle cx="10" cy="12" r="1.6"/><circle cx="15" cy="14" r="1.6"/><circle cx="18" cy="7" r="1.6"/><path d="M3 3v18h18"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',pulse:'<path d="M3 12h4l2-6 4 12 2-6h6"/>',pen:'<path d="m4 20 1-4L16 5l3 3L8 19l-4 1Z"/><path d="m14 7 3 3"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5"/>',spark:'<path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"/>'};
const svgEl=(inner,vb,cls)=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox',vb);if(cls)s.setAttribute('class',cls);s.innerHTML=inner;return s};
const icon=n=>svgEl(ICO[n]||ICO.spark,'0 0 24 24','ico');

function viz(v){if(!v)return null;
  const wrap=(body,label)=>h('div',{class:'viz'},body,h('span',{class:'vl'},label));
  if(v.t==='years'){const mx=Math.max(...v.data.map(d=>d[1]));return wrap(svgEl(v.data.map((d,k)=>{const hh=Math.max(2,d[1]/mx*44);return `<rect x="${k*22+2}" y="${50-hh}" width="16" height="${hh}" rx="3" class="${d[0]===v.hi?'on':'off'}"/>`}).join(''),'0 0 '+(v.data.length*22+2)+' 52','vb'),'Projects started per year, '+v.hi+' highlighted')}
  if(v.t==='dots'){const n=Math.min(v.of,60);return wrap(h('div',{class:'dg'},Array.from({length:n},(_,k)=>h('i',{class:k<v.n?'on':''}))),v.label)}
  if(v.t==='bars'){const rows=v.data.slice(0,6);const mx=Math.max(...rows.map(d=>d[0]));return wrap(h('div',{class:'hb'},rows.map(d=>h('div',{class:'hr'},h('span',{class:'hn'},d[1]),h('span',{class:'ht'},h('i',{style:'width:'+Math.max(4,d[0]/mx*100)+'%'})),h('span',{class:'hv'},d[0]+(v.unit||''))))),v.label)}
  if(v.t==='ratings'){const tot=v.five+v.four+v.three;return wrap(h('div',{class:'hb'},[[5,v.five],[4,v.four],[3,v.three]].map(([n,c])=>h('div',{class:'hr'},svgEl(Array.from({length:n},(_,k)=>`<g transform="translate(${k*13},0) scale(.5)">${STAR}</g>`).join(''),'0 0 66 12','st'),h('span',{class:'ht'},h('i',{style:'width:'+Math.max(4,c/tot*100)+'%'})),h('span',{class:'hv'},c)))),tot+' rated, '+v.un+' unrated')}
  if(v.t==='phases'){const mx=Math.max(...v.data.filter(x=>x!=null));return wrap(svgEl(v.data.map((d,k)=>d==null?'':`<rect x="${k*28+2}" y="${44-d/mx*40}" width="20" height="${d/mx*40}" rx="3" class="on"/>`).join('')+v.data.map((d,k)=>`<text x="${k*28+12}" y="58" text-anchor="middle" class="bt">${'ABCDE'[k]}<\/text>`).join(''),'0 0 142 62','vb'),v.label+', by phase')}
  return null}
const KIND={fact:['Recorded fact','var(--ink3)'],calc:['Calculated','var(--c-lead)'],inf:['Inferred pattern','var(--c-des)'],hyp:['Hypothesis','var(--c-res)']};

function renderInsights(){const all=A.insights();const box=$('#insx');if(!box)return;
