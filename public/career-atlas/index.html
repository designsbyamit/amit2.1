*{box-sizing:border-box}
html{scroll-behavior:smooth}
html{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin:0}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3,h4{margin:0;font-weight:400;text-wrap:balance}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.over{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
a{color:var(--link)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
/* hero */
.hero{padding:56px 0 40px}
.hero h1{font-family:var(--serif);font-size:clamp(2.6rem,7vw,5.6rem);line-height:1.02;letter-spacing:-.02em;margin:18px 0 22px;max-width:15ch}
.hero p.lead{font-size:clamp(1.05rem,1.6vw,1.3rem);color:var(--ink2);max-width:46rem;font-weight:300}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin-top:40px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.kpi{padding:20px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(2rem,4vw,3.2rem);line-height:1}
.kpi span{display:block;margin-top:8px;font-size:13px;color:var(--ink3)}
.note{margin-top:22px;padding:14px 16px;border:1px solid var(--line2);border-radius:10px;background:var(--s1);color:var(--ink2);font-size:14px;max-width:52rem}
/* filter bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(15,16,19,.94);background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar select,.bar input{background:var(--s2);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px;min-width:0;max-width:100%}
.bar input{flex:1 1 150px}
.chip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:hover{border-color:var(--ctl)}
.count{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-left:auto}
.nav{display:flex;gap:6px;flex-wrap:wrap;padding:14px 0 0}
/* chapters */
.ch{padding:72px 0 8px;border-top:1px solid var(--line);margin-top:56px;scroll-margin-top:90px}
.ch h2{font-family:var(--serif);font-size:clamp(1.9rem,4.4vw,3.4rem);line-height:1.08;letter-spacing:-.015em;margin:12px 0 16px;max-width:20ch}
.ch .story{max-width:44rem;color:var(--ink2);font-size:1.05rem;font-weight:300}
.ch .story p{margin:0 0 12px}
.take{margin:26px 0 0;padding:16px 18px;border-left:3px solid var(--signal);background:var(--s1);border-radius:0 10px 10px 0;max-width:46rem}
.take b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--signal-ink);display:block;margin-bottom:4px}
.fig{margin:36px 0 0;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:20px 18px 16px;min-width:0}
.fig h3{font-size:1.15rem;font-weight:500;margin-bottom:4px}
.fig .sub{font-size:14px;color:var(--ink3);margin:0 0 14px;max-width:46rem}
.fig .foot{font-size:12.5px;color:var(--ink3);margin-top:12px;max-width:50rem}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--sans);fill:var(--ink3);font-size:11px}
svg .t-ink{fill:var(--ink)} svg .t-ink2{fill:var(--ink2)}
svg .mono{font-family:var(--mono);font-size:10px}
.grid-line{stroke:var(--line);stroke-width:1}
.hit{cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 12px;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);margin-right:6px}
.tag.fact{border-color:var(--ink3)} .tag.calc{border-color:var(--c-lead);color:var(--c-lead)} .tag.inf{border-color:var(--c-des);color:var(--c-des)} .tag.hyp{border-color:var(--c-res);color:var(--c-res)}
/* insights */
.ins{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px;margin-top:18px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h4{font-family:var(--serif);font-size:1.3rem;line-height:1.2}
.card p{margin:0;font-size:14.5px;color:var(--ink2)}
.card .why{color:var(--ink3);font-size:13.5px}
.card .ev{font-family:var(--mono);font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line);padding-top:10px}
.card .cav{font-size:13px;color:var(--ink3)}
.card button.go{align-self:flex-start;background:transparent;border:1px solid var(--line2);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--ink2)}
.card button.go:hover{border-color:var(--ctl)}
.card .meta{display:flex;flex-wrap:wrap;gap:4px}

table{border-collapse:collapse;width:100%;font-size:14px}

td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer} tr.row:hover td{background:var(--s2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.und{color:var(--ink3);font-style:italic}

.drawer.open{transform:none}

.drawer dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:0;font-size:14px}

.acts .n{color:var(--ink3)} .acts .u{color:var(--ink3);border-style:dashed}
.x{position:absolute;top:14px;right:14px;background:var(--s2);border:1px solid var(--line2);border-radius:8px;width:34px;height:34px}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--s2);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;font-size:12.5px;color:var(--ink);max-width:260px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s}
#tip b{display:block;font-weight:500;margin-bottom:2px}
#tip span{color:var(--ink3);display:block}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.scrim.on{display:block}
.btn{background:var(--signal);color:var(--on-signal);border:0;border-radius:8px;padding:8px 14px;font-weight:500}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--ctl)}
details{border-top:1px solid var(--line);padding:12px 0}
details summary{cursor:pointer;color:var(--ink2)}
footer{padding:48px 0 64px;margin-top:64px;border-top:1px solid var(--line);color:var(--ink3);font-size:13px}
