<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Updated — SAP</title>
  <style>*:not(:defined){display:none}html{forced-color-adjust:none}</style>
