<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <style>*:not(:defined){display:none}html{forced-color-adjust:none}</style>
  <script type="module" crossorigin src="./assets/home-DlZMSryu.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/shared-BJko6njQ.js">
  <link rel="stylesheet" crossorigin href="./assets/shared-DnxjoRgd.css">
</head>
<body class="app-page">

  <ui5-shellbar id="shellbar">
    <img slot="logo"
      src="https://ui5.github.io/webcomponents/images/sap-logo-svg.svg"
      alt="SAP" />
    <ui5-avatar slot="profile" initials="AK" color-scheme="Accent1"
      accessible-name="Amit Kumar Tiwari"></ui5-avatar>
  </ui5-shellbar>

  <main class="app-main">
    <div class="app-welcome">
      <ui5-title level="H1">Welcome, Amit</ui5-title>
      <ui5-text>You are signed in to <span id="appNameDisplay"></span>.</ui5-text>
    </div>
  </main>

  <!-- User menu popover -->
  <ui5-popover id="userMenu" placement="Bottom" horizontal-align="End" class="user-menu">
    <div class="user-menu-header">
      <ui5-avatar initials="AK" color-scheme="Accent1" size="L"></ui5-avatar>
      <div class="user-menu-info">
        <ui5-title level="H5">Amit Kumar Tiwari</ui5-title>
        <ui5-text>ami.t@sap.com</ui5-text>
        <ui5-text>Design Manager · Cross Apps Experiences</ui5-text>
      </div>
      <ui5-button design="Default" class="user-menu-manage-btn">Manage Account</ui5-button>
    </div>
    <ui5-list separators="None">
      <ui5-li icon="action-settings">Settings</ui5-li>
      <ui5-li icon="official-service">Legal Information</ui5-li>
      <ui5-li icon="message-information">About</ui5-li>
    </ui5-list>
    <div slot="footer" class="user-menu-footer">
      <ui5-button id="signOutBtn" design="Transparent" icon="log">Sign Out</ui5-button>
    </div>
  </ui5-popover>

</body>
</html>
