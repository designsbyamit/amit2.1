<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Engaze · Tervana · interactive prototype</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F6F4">
<style>
@font-face{font-family:'Outfit';src:url(../order-confirmations/outfit.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{
 --canvas:#F6F6F4;--surface:#fff;--sunk:#F0F0ED;--line:#E3E3DF;--line-2:#CDCDC7;
 --ink:#0F1115;--ink-2:#383B44;--ink-3:#666A74;--ink-4:#A0A3AB;
 --primary:#5B3FE0;--primary-h:#4A2FCC;--primary-t:#F1EEFE;--primary-ink:#4326C4;
 --agent:linear-gradient(135deg,#7C5CFF,#22C7E8);
 --high:#D93D42;--high-t:#FCE9E9;--high-ink:#A61E24;
 --med:#D98E1F;--med-t:#FCF1E0;--med-ink:#8A5507;
 --low:#14936F;--low-t:#E3F4EE;--low-ink:#0B6B50;
 --r1:6px;--r2:8px;--r3:12px;--r4:16px;
 --e1:0 1px 2px rgba(15,17,21,.05),0 0 0 1px rgba(15,17,21,.06);
 --e2:0 8px 24px -8px rgba(15,17,21,.14),0 0 0 1px rgba(15,17,21,.06);
 --e3:0 24px 56px -16px rgba(15,17,21,.28),0 0 0 1px rgba(15,17,21,.07);
 --sans:'Outfit',system-ui,sans-serif;
 --top:60px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg:not(.logo) [stroke]{stroke-width:1.5px;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.t-sec{font:600 16px/1.3 var(--sans);letter-spacing:-.005em}
.t-sub{font:600 14px/1.35 var(--sans)}
.t-lab{font:500 12.5px/1.3 var(--sans);color:var(--ink-3)}
.t-small{font-size:13px;color:var(--ink-3)}
.muted{color:var(--ink-3)}.b{font-weight:600}.num{font-variant-numeric:tabular-nums}

/* frame */
.app{height:100dvh;display:grid;grid-template-rows:var(--top) 1fr}
.top{background:var(--surface);box-shadow:0 1px 0 var(--line);display:flex;align-items:center;gap:8px;padding:0 16px 0 20px;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px}
.brand .co{font:600 15px var(--sans);letter-spacing:-.01em}
.brand .sep{width:1px;height:20px;background:var(--line-2);margin:0 4px}
.brand .app-n{font:500 15px var(--sans);color:var(--ink-2)}
.sp{flex:1}
.ic{width:36px;height:36px;border-radius:var(--r2);display:grid;place-items:center;color:var(--ink-2);position:relative;flex:none}.ic:hover,.ic[aria-expanded=true]{background:var(--sunk);color:var(--ink)}
.ic svg{width:19px;height:19px}
.ic .dot{position:absolute;right:8px;top:8px;width:8px;height:8px;border-radius:99px;background:var(--high);box-shadow:0 0 0 2px #fff}
.av{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font:600 11px var(--sans);background:#E1DCFB;color:#3B2A8F;flex:none}
.av.p2{background:#D5EEE5;color:#0B5A43}.av.p3{background:#F7E3CB;color:#7A4A0B}.av.p4{background:#E1E5EC;color:#384152}.av.sm{width:24px;height:24px;font-size:9.5px}
.me{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 4px;border-radius:99px}.me:hover,.me[aria-expanded=true]{background:var(--sunk)}
.me .n{font:500 13.5px var(--sans)}
.only-m{display:none}
.body{display:grid;grid-template-columns:272px minmax(0,1fr) 320px;min-height:0}

/* threads */
.nav{background:var(--surface);box-shadow:1px 0 0 var(--line);display:flex;flex-direction:column;padding:16px 12px;min-height:0;overflow:auto}
.new{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line-2);font:500 14px var(--sans);background:#fff}
.new:hover{box-shadow:inset 0 0 0 1px var(--ink-4)}
.new svg{width:16px;height:16px}
.cap{font:500 12.5px var(--sans);color:var(--ink-3);padding:18px 10px 6px}
.th{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r2);font-size:14px;color:var(--ink-2);text-align:left}
.th:hover{background:var(--sunk);color:var(--ink)}
.th.on{background:var(--primary-t);color:var(--primary-ink);font-weight:500}
.th svg{width:16px;height:16px;flex:none;opacity:.8}
.th span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line)}
.nav-foot a{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2);text-decoration:none;padding:6px 0}.nav-foot a:hover{color:var(--ink)}
.nav-foot svg{width:15px;height:15px}

/* conversation */
.main{display:grid;grid-template-rows:1fr auto;min-height:0;position:relative}
.scroll{overflow:auto;min-height:0}
.col{max-width:760px;margin:0 auto;padding:0 28px}
.hello{padding:72px 0 24px}
.orb{width:48px;height:48px;border-radius:14px;background:var(--agent);display:grid;place-items:center;color:#fff;flex:none}
.orb svg{width:58%;height:58%}
.orb.sm{width:30px;height:30px;border-radius:9px}
.orb.think{animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(.92);opacity:.8}}
.hello h1{font:600 32px/1.15 var(--sans);letter-spacing:-.025em;margin-top:22px}
.hello p{color:var(--ink-2);margin-top:8px;font-size:16px;max-width:560px}
.nudges{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.nudge{background:var(--surface);border-radius:var(--r3);box-shadow:var(--e1);padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:box-shadow .15s}
.nudge:hover{box-shadow:var(--e2)}
.nudge .k{display:flex;align-items:center;gap:8px;font:500 12.5px var(--sans);color:var(--ink-3)}
.nudge .k i{width:7px;height:7px;border-radius:99px}
.nudge strong{font:600 15px/1.35 var(--sans);margin-top:6px}
.nudge span.d{color:var(--ink-2);font-size:14px}
.nudge em{font-style:normal;color:var(--primary-ink);font:500 14px var(--sans);margin-top:8px;display:flex;align-items:center;gap:6px}
.nudge em svg{width:14px;height:14px}
.suggest{margin-top:28px}
.suggest .t-lab{margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:34px;padding:0 14px;border-radius:99px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);font-size:14px;color:var(--ink);display:flex;align-items:center;gap:8px;white-space:nowrap}
.chips button:hover{box-shadow:inset 0 0 0 1px var(--primary);color:var(--primary-ink)}
.chips button svg{width:15px;height:15px;color:var(--ink-3)}

.thread{padding:28px 0 16px;display:flex;flex-direction:column;gap:22px}
.msg-me{align-self:flex-end;max-width:78%;background:var(--primary);color:#fff;border-radius:16px 16px 4px 16px;padding:10px 16px;font-size:15px}
.turn{display:grid;grid-template-columns:30px 1fr;gap:14px;align-items:start}
.turn .who{font:600 13.5px var(--sans);display:flex;align-items:center;gap:8px;height:30px}
.say{font-size:15.5px;color:var(--ink);margin-top:2px}
.say+.card,.say+.quote,.card+.chips,.card+.say,.steps+.say{margin-top:12px}
.steps{list-style:none;margin-top:6px;padding:12px 14px;border-radius:var(--r3);background:var(--surface);box-shadow:var(--e1);display:flex;flex-direction:column;gap:7px}
.steps.done{background:transparent;box-shadow:none;padding:2px 0 0}
.steps .h{font:500 12.5px var(--sans);color:var(--ink-3);display:flex;align-items:center;gap:8px}
.steps.done .h{cursor:pointer}
.steps li{display:flex;gap:10px;align-items:baseline;font-size:14px}
.steps li .ck{width:16px;height:16px;border-radius:99px;background:var(--low-t);color:var(--low-ink);display:grid;place-items:center;flex:none;transform:translateY(3px)}
.steps li .ck svg{width:10px;height:10px}
.steps li .spin{width:16px;height:16px;border-radius:99px;border:1.5px solid var(--line-2);border-top-color:var(--primary);flex:none;transform:translateY(3px);animation:spin .8s linear infinite}
@keyframes spin{to{transform:translateY(3px) rotate(360deg)}}
.steps li small{color:var(--ink-3);font-size:13px}

.card{background:var(--surface);border-radius:var(--r3);box-shadow:var(--e1);overflow:hidden}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 0}
.card .bd{padding:14px 18px 16px}
.card .ft{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:#FBFBFA}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font:500 12px var(--sans);white-space:nowrap}
.c-p{background:var(--primary-t);color:var(--primary-ink)}.c-n{background:var(--sunk);color:var(--ink-2)}.c-low{background:var(--low-t);color:var(--low-ink)}.c-med{background:var(--med-t);color:var(--med-ink)}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.src svg{width:13px;height:13px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px}
.kv dt{font:500 12.5px var(--sans);color:var(--ink-3)}.kv dd{font:500 15px var(--sans);margin-top:2px}
.tell{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px}
.tell .p{display:inline-flex;align-items:center;gap:8px}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);margin-top:12px}
.note svg{width:15px;height:15px;color:var(--low);flex:none;margin-top:3px}
.done-row{display:flex;gap:12px;align-items:flex-start;padding:16px 18px}
.done-row .tick{width:28px;height:28px;border-radius:99px;background:var(--low);color:#fff;display:grid;place-items:center;flex:none}
.done-row .tick svg{width:13px;height:13px}
.done-row .x{flex:1}
.done-row p{color:var(--ink-2);font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:var(--r2);font:500 14px var(--sans);white-space:nowrap;transition:background .15s,box-shadow .15s}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(67,38,196,.3)}.btn-p:hover{background:var(--primary-h)}
.btn-s{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}.btn-s:hover{box-shadow:inset 0 0 0 1px var(--ink-3)}
.btn-g{color:var(--ink-2)}.btn-g:hover{background:var(--sunk);color:var(--ink)}
.btn-sm{height:32px;padding:0 12px;font-size:13.5px}
.link{color:var(--primary-ink);font-weight:500}.link:hover{text-decoration:underline}

.fb{display:flex;gap:2px;align-items:center;margin-top:10px;margin-left:-8px;flex-wrap:wrap}
.fb .ic{width:30px;height:30px}.fb .ic svg{width:15px;height:15px}
.fb .ic[aria-pressed=true]{color:var(--primary-ink);background:var(--primary-t)}
.fb .srcs{display:flex;gap:12px;margin-left:10px;flex-wrap:wrap}

/* tax */
.tax{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:end}
.bars{display:flex;gap:18px;align-items:flex-end;height:150px}
.bar{width:76px;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar .stick{width:100%;border-radius:8px 8px 3px 3px;background:var(--line-2);position:relative;transition:height .8s cubic-bezier(.16,1,.3,1)}
.bar.best .stick{background:var(--primary)}
.bar .v{font:600 16px var(--sans)}.bar .l{font-size:12.5px;color:var(--ink-3)}
.why dl{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:14px;margin-top:6px}.why dt{color:var(--ink-3)}.why dd{font-weight:500;text-align:right}
.confirm{margin:0 18px 16px;padding:12px 14px;border-radius:var(--r2);background:var(--primary-t);font-size:14px;color:var(--ink)}
.confirm .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* ctc */
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;margin-top:10px}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 24px;margin-top:16px}
.legend div{display:flex;align-items:center;gap:10px;font-size:14px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;color:var(--ink-2)}.legend b{font-weight:500}
.big{font:600 28px/1.1 var(--sans);letter-spacing:-.02em}

/* balance */
.bal{display:flex;flex-direction:column;gap:12px}
.bal .r{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-size:14px}
.meter{grid-column:1/-1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .6s cubic-bezier(.16,1,.3,1)}
.meter.s i{background:var(--med)}

/* draft */
textarea.input{width:100%;border:0;outline:0;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line-2);padding:12px 14px;line-height:1.6;resize:vertical;background:#fff;font-size:14.5px}
textarea.input:focus{box-shadow:inset 0 0 0 1.5px var(--primary),0 0 0 4px rgba(91,63,224,.14)}
.opts-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.opts-row label{display:flex;flex-direction:column;gap:4px}

.quote{border-radius:var(--r3);background:var(--surface);box-shadow:var(--e1);padding:14px 18px;font-size:14.5px;color:var(--ink-2)}
.quote footer{margin-top:8px}
.hand{font-size:14px;color:var(--ink-2);margin-top:12px}

/* dock */
.dock{padding:10px 0 18px;background:linear-gradient(to top,var(--canvas) 70%,rgba(246,246,244,0))}
.composer{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:var(--r4);box-shadow:var(--e2);padding:8px 8px 8px 16px}
.composer:focus-within{box-shadow:0 0 0 1.5px var(--primary),0 0 0 5px rgba(91,63,224,.12),var(--e2)}
.composer input{flex:1;border:0;outline:0;background:none;font-size:15px;min-width:0;height:36px}
.composer input::placeholder{color:var(--ink-4)}
.send{width:36px;height:36px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
.send[disabled]{background:var(--sunk);color:var(--ink-4);cursor:not-allowed}
.send svg{width:16px;height:16px}
.fine{display:flex;gap:6px;align-items:center;justify-content:center;font-size:12.5px;color:var(--ink-3);margin-top:8px;text-align:center}
.fine svg{width:12px;height:12px;flex:none}

/* context */
.ctx{background:var(--canvas);box-shadow:-1px 0 0 var(--line);padding:20px 16px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.panel{background:var(--surface);border-radius:var(--r3);box-shadow:var(--e1);padding:16px 18px}
.panel .t-sub{margin-bottom:10px}
.todo{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;text-align:left;width:100%}.todo:first-of-type{border-top:0;padding-top:2px}
.todo i{width:7px;height:7px;border-radius:99px;margin-top:8px;flex:none}
.todo:hover b{color:var(--primary-ink)}
.todo b{font-weight:500;display:block}
.seeit{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink-2)}
.seeit li{display:flex;gap:10px;align-items:center}.seeit svg{width:16px;height:16px;color:var(--ink-3)}
.mem{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:9px 0;border-top:1px solid var(--line);text-align:left;font-size:14px}.mem:first-of-type{border-top:0}
.switch{width:36px;height:20px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:background .15s}.switch.on{background:var(--primary)}
.switch:after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:99px;background:#fff;transition:left .15s}.switch.on:after{left:18px}

/* menus and dropdowns */
.anc{position:relative;display:inline-flex}
.menu{position:absolute;right:0;top:calc(100% + 10px);width:290px;background:#fff;border-radius:var(--r3);box-shadow:var(--e3);padding:6px;z-index:45}.menu.a{animation:pop .15s}
.menu button{width:100%;text-align:left;padding:9px 10px;border-radius:var(--r2);display:flex;gap:10px;align-items:center;font-size:14px}.menu button:hover{background:var(--sunk)}
.menu svg{width:16px;height:16px;flex:none;color:var(--ink-3)}
.menu hr{border:0;height:1px;background:var(--line);margin:6px 0}
.menu .mh{display:flex;justify-content:space-between;align-items:center;padding:8px 10px}
.menu .item{display:flex;gap:10px;padding:10px;border-top:1px solid var(--line);font-size:13.5px}
.sel{position:relative;display:inline-block}
.sel>button{height:34px;min-width:150px;border-radius:var(--r2);background:#fff;box-shadow:inset 0 0 0 1px var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px 0 12px;font:400 14px var(--sans);text-align:left}
.sel>button:hover{box-shadow:inset 0 0 0 1px var(--ink-4)}
.sel>button[aria-expanded=true]{box-shadow:inset 0 0 0 1.5px var(--primary),0 0 0 4px rgba(91,63,224,.14)}
.sel>button svg{width:14px;height:14px;color:var(--ink-3);transition:transform .15s}
.sel>button[aria-expanded=true] svg{transform:rotate(180deg)}
.opts{position:absolute;left:0;min-width:100%;top:calc(100% + 6px);background:#fff;border-radius:var(--r2);box-shadow:var(--e3);padding:4px;z-index:70}.opts.a{animation:pop .12s}
.sel.right .opts{left:auto;right:0}
.opts button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 10px;border-radius:6px;font-size:14px;text-align:left;white-space:nowrap}
.opts button:hover{background:var(--sunk)}
.opts button[aria-selected=true]{color:var(--primary-ink);font-weight:500}
.opts small{display:block;color:var(--ink-3);font-size:12.5px;font-weight:400}
.opts button svg{width:12px;height:12px}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.99)}}

.scrim{position:fixed;inset:0;background:rgba(15,17,21,.32);z-index:50;display:grid;place-items:center}.scrim.a{animation:fi .15s}
@keyframes fi{from{opacity:0}}
.dialog{background:#fff;border-radius:14px;box-shadow:var(--e3);width:460px;max-width:calc(100vw - 32px)}.scrim.a .dialog{animation:pop .2s}
.dialog .dh{padding:20px 24px 4px;font:600 18px var(--sans);display:flex;justify-content:space-between;align-items:center}
.dialog .db{padding:6px 24px 16px}
.dialog .df{padding:14px 20px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--line);font-size:14.5px}.srow:first-child{border-top:0}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(15,17,21,.32)}.drawer.a{animation:fi .15s}
.drawer>.in{position:absolute;top:0;bottom:0;width:min(340px,88vw);background:var(--canvas);box-shadow:var(--e3);display:flex;flex-direction:column}.drawer.a>.in{animation:sl .22s cubic-bezier(.16,1,.3,1)}
.drawer.l>.in{left:0;background:var(--surface)}.drawer.r>.in{right:0}.drawer.a.r>.in{animation-name:sr}
.drawer .dhd{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 12px 20px;min-height:56px}
@keyframes sl{from{transform:translateX(-100%)}}@keyframes sr{from{transform:translateX(100%)}}
.drawer .nav{box-shadow:none;flex:1}.drawer .ctx{box-shadow:none;flex:1}

.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;border-radius:10px;min-height:44px;padding:10px 18px;display:flex;align-items:center;gap:10px;box-shadow:var(--e3);font-size:14px;max-width:calc(100vw - 32px)}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
.fade.a{animation:fade .3s}.toast.a{animation:up .3s}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.badge{position:fixed;left:12px;bottom:10px;font-size:11.5px;color:var(--ink-4);z-index:1}

/* tablet: context becomes a slide-over */
@media (max-width:1180px){.body{grid-template-columns:248px minmax(0,1fr)}.body>.ctx{display:none}.only-t{display:grid}}
@media (min-width:1181px){.only-t{display:none}}
/* phone */
@media (max-width:760px){
 :root{--top:56px}
 body{font-size:15px}
 .top{padding:0 8px}
 .only-m{display:grid}.hide-m{display:none!important}
 .brand .sep,.brand .co{display:none}
 .brand .app-n{color:var(--ink);font-weight:600}
 .body{grid-template-columns:1fr}.body>.nav{display:none}
 .col{padding:0 16px}
 .hello{padding:32px 0 8px}
 .hello h1{font-size:26px;margin-top:16px}
 .hello p{font-size:15px}
 .nudges{grid-template-columns:1fr;gap:10px;margin-top:20px}
 .suggest{margin-top:22px}
 .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
 .thread{padding:18px 0 8px;gap:18px}
 .turn{grid-template-columns:1fr;gap:6px}
 .turn>.orb{display:none}
 .msg-me{max-width:88%}
 .kv{grid-template-columns:1fr 1fr}
 .tax{grid-template-columns:1fr;gap:18px}
 .bars{height:120px}
 .legend{grid-template-columns:1fr}
 .card .ft .btn{flex:1}
 .dock{padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
 .fine{display:none}
 .dialog{position:fixed;left:0;right:0;bottom:0;width:100%;max-width:none;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}.scrim.a .dialog{animation:sheet .25s cubic-bezier(.16,1,.3,1)}
 .scrim{place-items:end stretch}
 @keyframes sheet{from{transform:translateY(100%)}}
 .toast{bottom:96px}
 .badge{display:none}
 .menu{position:fixed;left:8px;right:8px;top:calc(var(--top) + 6px);width:auto!important}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
