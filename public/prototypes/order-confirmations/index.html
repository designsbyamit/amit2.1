<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supplier Order Assistant · Tervana · interactive prototype</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'Outfit';src:url(outfit.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{
 --canvas:#F6F6F4;--surface:#fff;--sunk:#F0F0ED;--line:#E3E3DF;--line-2:#CDCDC7;
 --ink:#0F1115;--ink-2:#383B44;--ink-3:#666A74;--ink-4:#A0A3AB;
 --primary:#5B3FE0;--primary-h:#4A2FCC;--primary-t:#F1EEFE;--primary-ink:#4326C4;
 --agent:linear-gradient(135deg,#7C5CFF,#22C7E8);
 --high:#D93D42;--high-t:#FCE9E9;--high-ink:#A61E24;
 --med:#D98E1F;--med-t:#FCF1E0;--med-ink:#8A5507;
 --low:#14936F;--low-t:#E3F4EE;--low-ink:#0B6B50;
 --r1:6px;--r2:8px;--r3:12px;
 --e1:0 1px 2px rgba(15,17,21,.05),0 0 0 1px rgba(15,17,21,.06);
 --e2:0 8px 24px -8px rgba(15,17,21,.14),0 0 0 1px rgba(15,17,21,.06);
 --e3:0 24px 56px -16px rgba(15,17,21,.28),0 0 0 1px rgba(15,17,21,.07);
 --sans:'Outfit',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-width:1180px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.t-page{font:600 26px/1.2 var(--sans);letter-spacing:-.02em}
.t-sec{font:600 16px/1.3 var(--sans);letter-spacing:-.005em}
.t-sub{font:600 14px/1.35 var(--sans)}
.t-lab{font:500 12.5px/1.3 var(--sans);color:var(--ink-3)}
.t-small{font-size:13px;color:var(--ink-3)}
.muted{color:var(--ink-3)}.b{font-weight:600}.num{font-variant-numeric:tabular-nums}
.spark{width:12px;height:12px;flex:none;vertical-align:-1px}
/* one line weight for every icon: 1.5px on screen, whatever the icon size */
svg:not(.logo) [stroke]{stroke-width:1.5px;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:0;z-index:30;height:60px;background:var(--surface);box-shadow:0 1px 0 var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
.brand{display:flex;align-items:center;gap:10px}
.brand .co{font:600 15px var(--sans);letter-spacing:-.01em}
.brand .sep{width:1px;height:20px;background:var(--line-2);margin:0 4px}
.brand .app{font:500 15px var(--sans);color:var(--ink-2)}
.sp{flex:1}
.ic{width:36px;height:36px;border-radius:var(--r2);display:grid;place-items:center;color:var(--ink-2);position:relative}.ic:hover{background:var(--sunk);color:var(--ink)}
.ic svg{width:19px;height:19px}
.ic .dot{position:absolute;right:8px;top:8px;width:8px;height:8px;border-radius:99px;background:var(--high);box-shadow:0 0 0 2px #fff}
.av{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font:600 11px var(--sans);background:#E1DCFB;color:#3B2A8F;flex:none}
.av.p2{background:#D5EEE5;color:#0B5A43}.av.p3{background:#F7E3CB;color:#7A4A0B}.av.p4{background:#E1E5EC;color:#384152}.av.sm{width:24px;height:24px;font-size:9.5px}.av.ag{background:var(--agent);color:#fff}
.me{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 4px;border-radius:99px}.me:hover{background:var(--sunk)}
.me .n{font:500 13.5px var(--sans)}
.wrap{max-width:1440px;margin:0 auto;padding:0 32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:var(--r2);font:500 14px var(--sans);white-space:nowrap;transition:background .15s,box-shadow .15s,color .15s}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(67,38,196,.3)}.btn-p:hover{background:var(--primary-h)}
.btn-s{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}.btn-s:hover{box-shadow:inset 0 0 0 1px var(--ink-3);background:#FBFBFA}
.btn-g{color:var(--ink-2)}.btn-g:hover{background:var(--sunk);color:var(--ink)}
.btn[disabled]{background:var(--sunk);color:var(--ink-4);box-shadow:none;cursor:not-allowed}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.link{color:var(--primary-ink);font-weight:500}.link:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font:500 12px var(--sans);white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:99px;background:currentColor}
.c-high{background:var(--high-t);color:var(--high-ink)}.c-high i{background:var(--high)}
.c-med{background:var(--med-t);color:var(--med-ink)}.c-med i{background:var(--med)}
.c-low{background:var(--low-t);color:var(--low-ink)}.c-low i{background:var(--low)}
.c-n{background:var(--sunk);color:var(--ink-2)}.c-p{background:var(--primary-t);color:var(--primary-ink)}
.st{display:inline-flex;align-items:center;gap:8px;font-size:13.5px}.st i{width:8px;height:8px;border-radius:99px;background:var(--ink-4)}
.st.new i{background:var(--primary)}.st.wip i{background:var(--med)}.st.ok i{background:var(--low)}.st.bad i{background:var(--high)}.st.off{color:var(--ink-3)}
.cdot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)}.cdot i{width:7px;height:7px;border-radius:99px}
.card{background:var(--surface);border-radius:var(--r3);box-shadow:var(--e1)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px}
table{width:100%;border-collapse:collapse}
th{font:500 12.5px var(--sans);color:var(--ink-3);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}.nw{white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:#F8F7FE}
tr.grp td{padding:8px 14px;background:#FAFAF8;font:600 12.5px var(--sans);color:var(--ink-2)}
tr.other td{color:var(--ink-3)}
tr.flash td{animation:flash 1.6s}@keyframes flash{0%{background:var(--primary-t)}100%{background:transparent}}
.idc{color:var(--ink-2);font-variant-numeric:tabular-nums}
.tabsv{display:inline-flex;gap:4px}
.tabsv button{height:34px;padding:0 14px;border-radius:99px;font:500 13.5px var(--sans);color:var(--ink-2);display:flex;gap:8px;align-items:center}
.tabsv button:hover{background:var(--sunk)}
.tabsv button.on{background:var(--ink);color:#fff}
.tabsv em{font-style:normal;font-size:12px;opacity:.7}
.input{height:38px;border-radius:var(--r2);background:#fff;box-shadow:inset 0 0 0 1px var(--line-2);display:flex;align-items:center;padding:0 12px;gap:8px;width:100%;border:0;outline:0;transition:box-shadow .15s}
.input:hover{box-shadow:inset 0 0 0 1px var(--ink-4)}
.input:focus,.input:focus-within{box-shadow:inset 0 0 0 1.5px var(--primary),0 0 0 4px rgba(91,63,224,.14)}
.input.changed{box-shadow:inset 0 0 0 1px var(--primary);background:#FBFAFF}
.input[readonly]{background:var(--sunk);box-shadow:none}
textarea.input{height:auto;padding:12px;line-height:1.55;resize:vertical}
.head{background:var(--surface);box-shadow:0 1px 0 var(--line)}
.crumb{font-size:13px;color:var(--ink-3)}.crumb button{color:var(--primary-ink);font-weight:500}.crumb button:hover{text-decoration:underline}
.ptabs{display:flex;gap:28px;margin-top:18px}
.ptabs button{font:500 14px var(--sans);color:var(--ink-3);padding-bottom:12px;position:relative;display:flex;gap:6px;align-items:center}
.ptabs button:hover{color:var(--ink)}
.ptabs button.on{color:var(--ink)}.ptabs button.on:after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--primary)}
.ptabs .cnt{font-size:12px;background:var(--sunk);border-radius:99px;padding:0 7px;color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:6px 0;color:var(--ink-2);font-size:14px;margin-top:8px}
.meta>span{padding:0 14px;border-left:1px solid var(--line-2)}.meta>span:first-child{padding-left:0;border:0}
.grid2{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:80px}
.rec{padding:20px}.rec .say{font:600 17px/1.4 var(--sans);margin-top:10px;letter-spacing:-.005em}.rec .why{color:var(--ink-2);margin-top:8px}
.rec .next{margin:18px -20px -20px;padding:16px 20px 18px;border-top:1px solid var(--line);background:#FBFBFA;border-radius:0 0 var(--r3) var(--r3)}
.who{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.who:first-child{border-top:0}.who .n{flex:1}
.prog{display:block;height:4px;border-radius:4px;background:var(--sunk);overflow:hidden;width:56px}.prog i{display:block;height:100%;background:var(--primary)}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line)}
.tile{padding:16px 20px;border-left:1px solid var(--line)}.tile:first-child{border-left:0}
.tile .v{font:600 22px/1.2 var(--sans);letter-spacing:-.01em;margin-top:6px}.tile .s{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.steps{display:flex;gap:3px}
.stp{flex:1;padding:9px 10px;background:var(--sunk);font:500 12px/1.3 var(--sans);color:var(--ink-3);min-height:54px}
.stp:first-child{border-radius:var(--r2) 0 0 var(--r2)}.stp:last-child{border-radius:0 var(--r2) var(--r2) 0}
.stp.done{background:var(--low-t);color:var(--low-ink)}.stp.now{background:var(--primary);color:#fff}
.stp b{display:block;font-weight:600;margin-bottom:2px;opacity:.75;font-size:11px}
.trace{padding:14px 16px;border-radius:var(--r2);background:#FAFAF8;border:1px solid var(--line)}
.trace dl{display:grid;grid-template-columns:100px 1fr;gap:4px 12px;margin-top:8px;font-size:13.5px}.trace dt{color:var(--ink-3)}
.act{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line);align-items:flex-start}.act:first-child{border-top:0}
.act .n{width:24px;height:24px;border-radius:99px;background:var(--sunk);display:grid;place-items:center;font:600 12px var(--sans);color:var(--ink-2);flex:none}
ul.li{list-style:none}ul.li li{padding:9px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}ul.li li:first-child{border-top:0}ul.li li>span:first-child{color:var(--ink-3)}
.feed{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.feed:first-child{border-top:0}
.ag-t{background:var(--agent);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
.dec{display:inline-flex;gap:6px}
.dec button{height:32px;padding:0 12px;border-radius:var(--r2);font:500 13px var(--sans);color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--line-2);display:flex;align-items:center;gap:6px}
.dec button:hover{box-shadow:inset 0 0 0 1px var(--ink-3)}
.dec button.acc.on{background:var(--low);color:#fff;box-shadow:none}
.dec button.rej.on{background:var(--high);color:#fff;box-shadow:none}
.sug{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);margin-top:6px}
.sug.diff{color:var(--med-ink)}
.done-by{font-size:12px;color:var(--ink-3);margin-top:2px}
.split{display:grid;grid-template-columns:1fr 480px;min-height:calc(100vh - 210px)}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 28px;padding:4px 20px 22px}
.fl .top2{display:flex;justify-content:space-between;align-items:center}
.fl .v{margin-top:6px;font-size:15px}
.fl .input{margin-top:6px}
.pdfpane{background:#ECECE8;border-left:1px solid var(--line);padding:24px}
.pdf{background:#fff;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px -12px rgba(0,0,0,.2);padding:24px;font:7px/1.55 Arial,sans-serif;color:#555;position:sticky;top:84px}
.pdf .pbar{background:#2a2b2f;color:#fff;font:700 9.5px Arial;padding:6px 8px;display:flex;justify-content:space-between}
.pdf table td,.pdf table th{padding:3px 4px;font:6.5px Arial;color:#555;border-bottom:1px solid #ddd;background:none}
.pdf table th{background:#2a2b2f;color:#fff;font-weight:700}
.pdf .ln{height:5px;background:#e8e8e8;border-radius:2px;margin:4px 0}
.hl{box-shadow:0 0 0 1.5px var(--primary);background:rgba(91,63,224,.1);border-radius:2px;padding:0 2px}
.actionbar{position:sticky;bottom:20px;margin-top:16px;background:#fff;border-radius:var(--r3);box-shadow:var(--e3);height:60px;display:flex;align-items:center;gap:10px;padding:0 12px 0 20px;z-index:5}
.tl{position:relative;padding:0 24px 16px}
.tl-day{font:600 13px var(--sans);color:var(--ink-2);margin:14px 0 6px 52px}
.tl-i{position:relative;display:grid;grid-template-columns:52px 1fr;padding:8px 0 14px}
.tl-i:before{content:'';position:absolute;left:15px;top:40px;bottom:-8px;width:2px;background:var(--line)}
.tl-i.last:before{display:none}
.tl-i .node{width:32px;height:32px;display:grid;place-items:center;z-index:1}
.tl-i .node .av{width:32px;height:32px;font-size:11px}
.tl-i .time{font-size:12.5px;color:var(--ink-3)}
.tl-i .x{margin-top:2px}
.scrim{position:fixed;inset:0;background:rgba(15,17,21,.32);z-index:50;display:grid;place-items:center;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.dialog{background:#fff;border-radius:14px;box-shadow:var(--e3);width:480px;max-height:92vh;overflow:auto;animation:pop .2s}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.99)}}
.dialog .dh{padding:22px 24px 0;font:600 18px var(--sans)}.dialog .db{padding:10px 24px 20px;color:var(--ink-2)}
.dialog .df{padding:14px 20px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;border-radius:10px;height:44px;padding:0 18px;display:flex;align-items:center;gap:10px;box-shadow:var(--e3);animation:up .3s}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
.menu{position:absolute;right:16px;top:54px;width:290px;background:#fff;border-radius:var(--r3);box-shadow:var(--e3);padding:6px;z-index:45;animation:pop .15s}
.menu button{width:100%;text-align:left;padding:9px 10px;border-radius:var(--r2);display:flex;gap:10px;align-items:center}.menu button:hover{background:var(--sunk)}
.menu hr{border:0;height:1px;background:var(--line);margin:6px 0}
.pop{position:absolute;z-index:20;background:#fff;border-radius:var(--r3);box-shadow:var(--e3);padding:14px;width:240px}
.check{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:var(--r1);cursor:pointer}.check:hover{background:var(--sunk)}
.check input{accent-color:var(--primary);width:16px;height:16px}
.switch{width:36px;height:20px;border-radius:99px;background:var(--line-2);position:relative;flex:none}.switch.on{background:var(--primary)}
.switch:after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:99px;background:#fff;transition:left .15s}.switch.on:after{left:18px}
.coach{position:fixed;left:20px;bottom:20px;z-index:35;width:320px;background:var(--ink);color:#fff;border-radius:var(--r3);box-shadow:var(--e3);padding:16px}
.coach .lbl{font:600 12px var(--sans);color:#A7A9B2}.coach p{margin-top:6px;font-size:14px;line-height:1.5}
.coach-min{position:fixed;left:20px;bottom:20px;z-index:35}
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 520px at 50% -10%,#E9E4FF,transparent 70%),var(--canvas)}
.persona{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line);text-align:left;width:100%;background:#fff}
.persona:hover{box-shadow:inset 0 0 0 1px var(--ink-4)}.persona.on{box-shadow:inset 0 0 0 2px var(--primary);background:#FBFAFF}
.fade{animation:fade .25s}@keyframes fade{from{opacity:0;transform:translateY(4px)}}
</style></head><body><div id="app"></div>
<script src="app.js"></script></body></html>
