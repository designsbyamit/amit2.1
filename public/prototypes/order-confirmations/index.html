.ask:hover{box-shadow:inset 0 0 0 1px var(--line-2)}

.ic svg{width:17px;height:17px}
.ic .dot{position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:99px;background:var(--high);box-shadow:0 0 0 2px #fff}

.btn-a{background:var(--agent);color:#fff}.btn-a:hover{filter:brightness(1.05)}

.c-high{background:var(--high-t);color:var(--high-ink)}.c-high i{background:var(--high)}
.c-med{background:var(--med-t);color:var(--med-ink)}.c-med i{background:var(--med)}

  return['Gate 3: review the reply the agent drafted from the decisions, then send it.',['reply',null,'Review the reply']]}
 if(o.ver===1)return['The supplier answers. Simulate the revised confirmation.',r==='buyer'?['revise',null,'Simulate the revision']:['switch','buyer','Switch to Adrian']]
 if(!o.closed){if(!o.saved.buyer)return['Version 2 has two differences. Decide them, then save.',S.tab!=='Differences'?['tab','Differences','Go to Differences']:null]
  if(!o.sent)return['Send the reply on version 2.',['reply',null,'Review the reply']]
  return['Close the order. Everything stays on the record in Activity.',['close',null,'Close the order']]}
 return['That is the whole flow: three gates, three people, one record. Reset to start again.',['reset',null,'Start again']]}
function coach(){if(!S.coach)return `<button class="coach-min btn btn-p" data-a="coach">${I.help} Guide</button>`
 const [t,a]=next()
 return `<div class="coach fade"><div style="display:flex;justify-content:space-between;align-items:center"><span class="k">Guide</span><button style="color:#9b9da6" data-a="coach">${I.x}</button></div><p>${t}</p>${a?`<div class="row"><button class="btn btn-sm" style="background:#fff;color:var(--ink)" data-a="${a[0]}" ${a[0]==='switch'?`data-r="${a[1]}"`:a[0]==='tab'?`data-t="${a[1]}"`:''}>${a[2]}</button></div>`:''}</div>`}
/* ============ render & events ============ */
function render(){
  const app=document.getElementById('app')
  const focus=document.activeElement&&document.activeElement.name==='q'
  app.innerHTML=S.view==='login'?login():shell(S.view==='worklist'?worklist():order())
  if(focus){const el=app.querySelector('input[name=q]');el&&el.focus()}
}
function go(view,tab){S.view=view;if(tab!==undefined)S.tab=tab;S.menu=false;S.bell=false;render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el){if(S.menu||S.bell){S.menu=false;S.bell=false;render()}return}
  const a=el.dataset.a,o=O()
  if(a==='chatform'||a==='tone')return
  const A={
   pick:()=>{S.picked=el.dataset.r;render()},
   login:()=>{S.user=S.picked;S.tab=null;go('worklist')},
   home:()=>go('worklist'),
   open:()=>{S.tab=null;go('order')},
   tab:()=>{S.tab=el.dataset.t;S.view='order';render();window.scrollTo(0,0)},
   menu:()=>{S.menu=!S.menu;S.bell=false;render()},
   bell:()=>{S.bell=!S.bell;S.menu=false;render()},
   coach:()=>{S.coach=!S.coach;render()},
   drawer:()=>{S.drawer=!S.drawer;render()},
   switch:()=>{S.picked=el.dataset.r;S.user=el.dataset.r;S.tab=null;S.drawer=false;go('worklist');toast(`Signed in as ${PEOPLE[S.user].n}`)},
   signout:()=>{S.user=null;S.drawer=false;go('login')},
   reset:()=>{S=fresh();render()},
   edit:()=>{o.editing=true;S.tab='Extraction';render()},
   canceledit:()=>{o.editing=false;render()},
   saveedit:()=>{document.querySelectorAll('[data-f]').forEach(i=>{const k=i.dataset.f;if(i.value!==o.fields[k]){log('ops',`Extraction corrected: ${FIELDS.find(f=>f[0]===k)[1].toLowerCase()} <s class="muted">${o.fields[k]}</s> → ${i.value}.`);o.fields[k]=i.value;o.edited[k]=true}});o.editing=false;toast('Corrections saved');render()},
   validate:()=>{S.dialog='validate';render()},
   'close-d':()=>{S.dialog=null;render()},
   confirmval:()=>{o.stage='validated';S.dialog=null;log('ops','Validation confirmed. The reading is now the record.');log('agent','Compared with the PO: 7 differences, risk high. 5 routed to Adrian, 2 to Rajan.');toast('Validated. The agent is comparing it with the PO.');render()},
   dec:()=>{const d=o.diffs.find(x=>x.id===el.dataset.id);d.dec=d.dec===el.dataset.v?null:el.dataset.v;render()},
   acceptsug:()=>{o.diffs.filter(d=>d.own===S.user&&d.sug).forEach(d=>d.dec=d.sug);toast('Suggestions applied. Check each before saving.');render()},
   savedec:()=>{const r=S.user;o.saved[r]=true;const ds=o.diffs.filter(d=>d.own===r);log(r,`${r==='gr'?'Goods recipient':'Buyer'} decisions ${r==='gr'?'submitted':'saved'}: ${ds.filter(d=>d.dec==='accept').length} accepted, ${ds.filter(d=>d.dec==='reject').length} rejected.`);
     if(o.saved.buyer&&o.saved.gr)log('agent','Every decision is in. Reply to the supplier drafted.');toast(r==='gr'?'Decisions submitted':'Decisions saved');render()},
   reply:()=>{S.tab='Differences';S.view='order';S.dialog='reply';render()},
   send:()=>{o.sent=true;S.dialog=null;log('buyer',`Reply sent to the supplier${o.ver===2?' on version 2':''}.`);if(o.ver===1)log('agent','Watching the mailbox for a revised confirmation.');toast('Email sent to the supplier');render()},
   revise:()=>{o.ver=2;o.sent=false;o.saved={buyer:false,gr:true};o.diffs=DIFFS2();log('agent','Revised confirmation 1505899/2 received and read. 2 differences remain; quantity and delivery now match the PO.');S.flash='row';setTimeout(()=>S.flash=null,1700);toast('Version 2 arrived');S.tab='Overview';render()},
   close:()=>{o.closed=true;log('buyer','Order closed.');log('sys','Confirmation archived with both versions.');toast('Order closed');render()},
   conn:()=>{const k=el.dataset.k;S.conn[k]=!S.conn[k];log('admin',`${k==='mail'?'Mailbox':'ERP'} ${S.conn[k]?'connected':'disconnected'}.`);render()},
   auto:()=>{S.autonomy=el.dataset.k;toast('Autonomy updated');render()},
   sugg:()=>{const q=el.dataset.q;S.chat.push({me:true,t:q},{me:false,t:answer(q)});render()},
  }
  if(A[a]){e.preventDefault();A[a]()}
})
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.a==='chatform'){e.preventDefault();const q=f.q.value.trim();if(!q)return;S.chat.push({me:true,t:q},{me:false,t:answer(q)});render()}})
document.addEventListener('change',e=>{if(e.target.dataset.a==='tone'){S.tone=e.target.value;render()}})
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&S.user){e.preventDefault();S.drawer=!S.drawer;render()}if(e.key==='Escape'&&(S.dialog||S.drawer)){S.dialog=null;S.drawer=false;render()}})
render()
</script></body></html>
