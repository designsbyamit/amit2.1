<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>AI-Powered Search · Prototype</title>
  <script type="module" crossorigin src="./assets/index-Iom94TBo.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DwxVc9O8.css">
</head>
<body>
<ui5-shellbar id="shell" show-notifications show-product-switch show-search-field>
  <ui5-shellbar-branding slot="branding" id="brand"><img slot="logo" src="./sap-logo.png" alt="SAP"><span id="brandTitle">S/4HANA Cloud</span></ui5-shellbar-branding>
  <ui5-shellbar-search slot="searchField" id="search" placeholder="Search across all SAP applications..." show-clear-icon></ui5-shellbar-search>
  <ui5-avatar slot="profile" size="XS"><img src="./avatar.png" alt="Profile"></ui5-avatar>
</ui5-shellbar>
<main id="app" aria-live="polite"></main>
<ui5-popover id="apps" header-text="SAP applications" placement="Bottom">
  <ui5-list separators="Inner">
    <ui5-li type="Active" data-go="home" description="Global search home">S/4HANA Cloud</ui5-li>
    <ui5-li type="Active" data-go="capsules" description="AI capsules">Ariba</ui5-li>
    <ui5-li type="Active" data-go="travel" description="Travel &amp; Expense">Concur</ui5-li>
    <ui5-li type="Active" data-go="goals" description="People &amp; Performance">SuccessFactors</ui5-li>
  </ui5-list>
</ui5-popover>
<ui5-dialog id="handoff" accessible-name="Opening application">
  <div class="hand"><div class="mk">C</div><ui5-title level="H4" size="H4" class="hn">SAP Concur</ui5-title><ui5-label class="ht">Opening…</ui5-label><ui5-progress-indicator value="0" hide-value></ui5-progress-indicator><ui5-button id="hcancel">Cancel</ui5-button></div>
</ui5-dialog>
<ui5-toast id="toast" placement="BottomCenter"></ui5-toast>
</body>
</html>
