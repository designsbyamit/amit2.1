<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Preferences · Collections Assistant</title>
  <link rel="icon" href="../../lib/assets/favicon.ico">
  <script data-ui5-config type="application/json">{ "theme": "sap_horizon" }</script>
  <script type="module" src="../../lib/ui5-bundle/ui5-bundle.js"></script>
  <script src="../../lib/shared/shellbar.js"></script>
  <style>
    @font-face { font-family:"72"; font-weight:400; src:url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Regular.woff2") format("woff2"); }
    @font-face { font-family:"72"; font-weight:700; src:url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Bold.woff2") format("woff2"); }
    @font-face { font-family:"72"; font-weight:600; src:url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Semibold.woff2") format("woff2"); }
    @font-face { font-family:"72"; font-weight:300; src:url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Light.woff2") format("woff2"); }
    ui5-button { --sapButton_FontFamily: "72", sans-serif; }
    ui5-button::part(text) { font-family: "72", sans-serif; font-weight: 400; }
    *,*::before,*::after{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:"72",sans-serif;background:var(--sapBackgroundColor);color:var(--sapTextColor)}
    header{padding:.75rem 2rem;background:var(--sapBaseColor);border-bottom:1px solid var(--sapList_BorderColor);font-size:1.375rem;font-weight:700}main{padding:1.5rem 2rem}.card{max-width:760px;background:var(--sapBaseColor);border:1px solid var(--sapList_BorderColor);border-radius:var(--sapTile_BorderCornerRadius,1rem);overflow:hidden}.card-title{padding:1rem;border-bottom:1px solid var(--sapList_BorderColor);font-weight:700}.form{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;padding:1.25rem}.field{display:flex;flex-direction:column;gap:.375rem}.field ui5-select{width:100%}.actions{display:flex;justify-content:flex-end;gap:.5rem;padding:1rem;border-top:1px solid var(--sapList_BorderColor)}@media(max-width:700px){.form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <app-shellbar title="User Preferences" base-path="../../" avatar-initials="SS" hide-product-switch></app-shellbar>
  <header>User Preferences</header>
  <main><section class="card"><div class="card-title">Display and locale</div><div class="form">
    <div class="field"><label for="language">Language</label><ui5-select id="language"><ui5-option selected>English</ui5-option><ui5-option>Deutsch</ui5-option><ui5-option>Français</ui5-option></ui5-select></div>
    <div class="field"><label for="timezone">Time zone</label><ui5-select id="timezone"><ui5-option selected>Europe/London</ui5-option><ui5-option>Europe/Zurich</ui5-option><ui5-option>America/New_York</ui5-option></ui5-select></div>
    <div class="field"><label for="currency">Default currency</label><ui5-select id="currency"><ui5-option selected>GBP — British Pound</ui5-option><ui5-option>EUR — Euro</ui5-option><ui5-option>USD — US Dollar</ui5-option></ui5-select></div>
    <div class="field"><label for="dateFormat">Date format</label><ui5-select id="dateFormat"><ui5-option selected>DD MMM YYYY</ui5-option><ui5-option>MM/DD/YYYY</ui5-option></ui5-select></div>
  </div><div class="actions"><ui5-button design="Emphasized" id="savePreferences">Save</ui5-button><ui5-button design="Transparent" onclick="location.href='launchpad-with-collections.html'">Cancel</ui5-button></div></section></main>
  <ui5-toast id="preferenceToast">Preferences saved.</ui5-toast><script>document.getElementById('savePreferences').addEventListener('click',function(){document.getElementById('preferenceToast').show();});</script>
</body>
</html>
