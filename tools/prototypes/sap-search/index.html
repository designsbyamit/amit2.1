<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>AI-Powered Search · Prototype</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<ui5-shellbar id="shell" show-notifications notifications-count="3">
  <ui5-shellbar-branding slot="branding" id="brand">Home</ui5-shellbar-branding>
  <ui5-shellbar-search slot="searchField" id="search" placeholder="Search across all SAP applications..." show-clear-icon></ui5-shellbar-search>
  <ui5-avatar slot="profile" initials="AJ" color-scheme="Accent6"></ui5-avatar>
</ui5-shellbar>
<main id="app" aria-live="polite"></main>
<ui5-toast id="toast" placement="BottomCenter"></ui5-toast>
<script type="module" src="./main.js"></script>
</body>
</html>
