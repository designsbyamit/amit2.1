<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>AI-Powered Search · Prototype</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<ui5-shellbar id="shell" show-notifications>
  <ui5-shellbar-branding slot="branding" id="brand"><img slot="logo" src="./logo-placeholder.png" alt="Logo placeholder"><span id="brandTitle">S/4HANA Cloud</span></ui5-shellbar-branding>
  <ui5-shellbar-search slot="searchField" id="search" collapsed auto-open show-clear-icon no-typeahead placeholder="Search across all applications..." accessible-name="AI search across all applications"></ui5-shellbar-search>
  <ui5-shellbar-item id="help" icon="sys-help" text="Help"></ui5-shellbar-item>
  <ui5-shellbar-item id="shellMore" icon="overflow" text="More"></ui5-shellbar-item>
  <ui5-avatar slot="profile" size="XS"><img src="./avatar.png" alt="Profile"></ui5-avatar>
</ui5-shellbar>
<main id="app" aria-live="polite"></main>
<ui5-dialog id="handoff" accessible-name="Opening application">
  <div class="hand"><div class="mk">C</div><ui5-title level="H4" size="H4" class="hn">Concur</ui5-title><ui5-label class="ht">Opening…</ui5-label><ui5-progress-indicator value="0" hide-value></ui5-progress-indicator><ui5-button id="hcancel">Cancel</ui5-button></div>
</ui5-dialog>
<ui5-toast id="toast" placement="BottomCenter"></ui5-toast>
<script type="module" src="./main.js"></script>
</body>
</html>
