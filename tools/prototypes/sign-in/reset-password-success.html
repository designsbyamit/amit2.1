<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Updated — SAP</title>
  <style>*:not(:defined){display:none}html{forced-color-adjust:none}</style>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="signin-page">

  <main class="signin-center">
    <div class="signin-card">
    <ui5-card style="width:100%">
      <div class="signin-inner">
        <div class="signin-content">

          <!-- Sign-in Header -->
          <div class="signin-header">
            <ui5-shellbar-branding id="appBranding">
              <span id="appName"></span>
              <img slot="logo"
                src="./logo-placeholder.png"
                alt="SAP" />
            </ui5-shellbar-branding>
          </div>

          <!-- Page Title -->
          <div class="page-title">
            <ui5-title level="H2">Password updated!</ui5-title>
          </div>

          <!-- Body -->
          <div class="form-area">
            <ui5-text>Your password has been reset successfully.<br />Sign-in using your new password.</ui5-text>
          </div>

        </div>

        <!-- Card Footer -->
        <div class="card-footer">
          <ui5-button design="Emphasized" id="backBtn">Back to Sign In</ui5-button>
        </div>
      </div>
    </ui5-card>
    </div>
  </main>

  <footer class="page-footer">
    <ui5-link href="#">Privacy</ui5-link>
    <ui5-link href="#">Terms of use</ui5-link>
    <ui5-link href="#">Copyright</ui5-link>
    <ui5-link href="#">Cookie policy</ui5-link>
    <ui5-link href="#">Help</ui5-link>
  </footer>

  <script type="module" src="./shared.js"></script>
  <script type="module">
    const APP_NAMES = {
      s4hana:  'SAP S/4HANA',
      sac:     'SAP Analytics Cloud',
      sbn:     'SAP Business Network',
      concur:  'Concur',
      emarsys: 'Emarsys',
    };
    const APP_URLS = {
      s4hana:  './s4hana.html',
      sac:     './sac.html',
      sbn:     './sbn.html',
      concur:  './concur.html',
      emarsys: './emarsys.html',
    };

    const app = new URLSearchParams(location.search).get('app') || 'concur';
    document.getElementById('appName').textContent = APP_NAMES[app] || 'SAP';

    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = APP_URLS[app] || './index.html';
    });
  </script>
</body>
</html>
