<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lucid.css"><style>
/* page heads */
.ph{position:absolute;left:0;right:0;top:0;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.h1{font:200 30px/1.1 var(--sans);letter-spacing:-.03em}
.crumb{position:absolute;left:32px;top:18px;font:400 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.otitle{position:absolute;left:31px;top:38px;display:flex;align-items:center;gap:12px}
.ometa{position:absolute;left:32px;top:80px;display:flex;align-items:center;color:var(--ink-2);font-size:13.5px}
.ometa>span{padding:0 12px;border-left:1px solid var(--line-2);display:flex;align-items:center;gap:8px}.ometa>span:first-child{padding-left:0;border:0}
.oact{position:absolute;right:32px;top:40px;display:flex;gap:8px}
.tabs{position:absolute;left:32px;bottom:0;display:flex;gap:26px;height:30px}
.tabs span{font:400 13.5px var(--sans);color:var(--ink-3);position:relative}
.tabs span.on{color:var(--ink)}.tabs span.on:after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ink)}
.conf{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 9px;border-radius:var(--r1);background:var(--agent-tint);font:400 12px var(--sans);color:var(--agent-ink)}
.conf b{display:block;width:40px;height:3px;border-radius:3px;background:rgba(124,92,255,.18);overflow:hidden}.conf b i{display:block;height:100%;background:var(--agent)}
/* worklist */
.views{display:flex;gap:2px;padding:3px;border-radius:var(--r2);background:var(--sunk)}
.views span{height:26px;padding:0 10px;border-radius:var(--r1);display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.views span.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.views em{font-style:normal;font:400 11px var(--mono);color:var(--ink-3)}
.stat{display:flex;flex-direction:column;gap:6px;padding:0 0 0 20px;border-left:1px solid var(--line)}
.stat .v{font:200 26px/1 var(--sans);letter-spacing:-.03em}.stat .v small{font-size:14px;color:var(--ink-3)}
/* extraction */
.xl{position:absolute;left:0;top:132px;width:912px;bottom:0}
.xr{position:absolute;left:912px;right:0;top:132px;bottom:0;background:var(--sunk);box-shadow:inset 1px 0 0 var(--line);overflow:hidden}
.fg{display:grid;grid-template-columns:repeat(3,1fr)}
.fg>div{height:66px;padding:12px 16px;box-shadow:inset -1px -1px 0 var(--line)}
.fg .v{margin-top:8px;font-size:14px}
.pdf{position:absolute;left:28px;right:28px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px var(--line),0 8px 24px -12px rgba(17,18,22,.18);padding:24px;font:6.5px/1.5 Arial,sans-serif;color:#555;overflow:hidden}
.pdf .bar{background:#2a2b2f;color:#fff;font:700 9px Arial;padding:6px 8px;display:flex;justify-content:space-between}
.pdf table td,.pdf table th{height:auto;padding:3px 4px;font:6px Arial;color:#555;border-bottom:1px solid #ddd;text-transform:none;letter-spacing:0;white-space:normal;background:none}
.pdf table th{background:#2a2b2f;color:#fff;font-weight:700}
.pdf .h{font:700 7px Arial;color:#333;margin:10px 0 4px}
.pdf .ln{height:5px;background:#e3e3e3;border-radius:2px;margin:4px 0}
.hl{box-shadow:0 0 0 1.5px #7C5CFF;background:rgba(124,92,255,.08);border-radius:2px}
/* discrepancies */
.main{position:absolute;left:32px;width:1036px;top:156px}
.rail{position:absolute;left:1088px;right:32px;top:156px;display:flex;flex-direction:column;gap:12px}
.rec{padding:18px 20px}
.rec .say{font:500 16px/1.35 var(--sans);letter-spacing:-.01em;margin-top:12px}
.rec .why{color:var(--ink-2);margin-top:8px;font-size:13.5px}
.rec .next{margin:16px -20px -18px;padding:14px 20px 16px;box-shadow:0 -1px 0 var(--line)}
.rec .next .t{font:400 14px var(--sans);margin-top:8px}
.rec .next .d{color:var(--ink-2);font-size:13px;margin-top:2px}
.who{display:flex;align-items:center;gap:10px;height:40px;box-shadow:0 1px 0 var(--line)}.who:last-child{box-shadow:none}
.who .n{flex:1}.who .c{font:400 11px var(--mono);color:var(--ink-3)}
.bar2{width:56px;height:3px;border-radius:3px;background:var(--sunk);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--ink)}
.chg{display:flex;flex-direction:column;gap:1px}.chg .o{color:var(--ink-3);font-size:12.5px}.chg .o s{color:var(--ink-4)}
/* activity */
.tli{position:relative;padding-left:40px;height:72px}
.tli:before{content:'';position:absolute;left:11px;top:26px;bottom:-2px;width:1px;background:var(--line-2)}
.tli:last-child:before{display:none}
.tli .av{position:absolute;left:0;top:2px}
.tli .ts{font:400 11px var(--mono);color:var(--ink-3)}
.tli .tx{margin-top:3px}.tli .tx a{color:var(--accent);font-weight:400;margin-left:6px}
.tli .by{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.ag-t{background:var(--agent);-webkit-background-clip:text;color:transparent;font-weight:400}
</style></head><body><script>
const S=`<svg class="spark" viewBox="0 0 16 16"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#22C7E8"/></linearGradient></defs><path fill="url(#g)" d="M8 0l1.7 5.1L15 7l-5.3 1.9L8 14l-1.7-5.1L1 7l5.3-1.9z"/></svg>`
const CHEV=`<svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 4.5l3 3 3-3"/></svg>`
const ICO={bell:`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 14V9a5 5 0 0110 0v5l1.5 1.5h-13zM8.5 17.5h3"/></svg>`,help:`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="10" cy="10" r="7.5"/><path d="M8 8a2 2 0 113 1.7c-.7.4-1 .8-1 1.6M10 14v.2"/></svg>`,send:`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M14 2L7 9M14 2l-4.5 12-2.5-5-5-2.5z"/></svg>`,cal:`<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="#8A8C95" stroke-width="1.3"><rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/></svg>`,search:`<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="#8A8C95" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>`,check:`<svg viewBox="0 0 10 10" width="9" height="9" fill="none" stroke="#fff" stroke-width="1.6"><path d="M2 5.2l2 2 4-4.4"/></svg>`,filter:`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4h11M4.5 8h7M6.5 12h3"/></svg>`,cols:`<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#4A4C55" stroke-width="1.3"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M6.2 3v10M9.8 3v10"/></svg>`}
const P={ops:['DP',''],buyer:['AS','p2'],gr:['RN','p3'],admin:['EH','p4']}
const MK=`<svg width="26" height="26" viewBox="0 0 100 100"><defs><linearGradient id="tv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6B4CF0"/><stop offset="1" stop-color="#3D2AB8"/></linearGradient></defs><rect x="4" y="4" width="92" height="92" rx="26" fill="url(#tv)"/><path d="M27 33h46M50 33v38" stroke="#fff" stroke-width="12" stroke-linecap="round"/><circle cx="73" cy="70" r="7" fill="#9EF0DA"/></svg>`
const NM={ops:'David Paul',buyer:'Adrian Smith',gr:'Rajan Nair',admin:'Emma Hudson'}
const topbar=(who)=>`<div class="top">${MK}<span class="prod" style="font-weight:500">Tervana</span><span style="width:1px;height:18px;background:var(--line-2);margin:0 2px"></span><span class="prod" style="color:var(--ink-2)">Supplier Order Assistant</span><span class="sp"></span><span class="ic">${ICO.bell}</span><span class="ic">${ICO.help}</span><span class="av ${P[who][1]}">${P[who][0]}</span><span style="font-size:13.5px;margin-left:-4px">${NM[who]}</span></div>`
const chip=(r)=>`<span class="chip ${{High:'c-high',Medium:'c-med',Low:'c-low'}[r]}"><i></i>${r}</span>`
const seg=(v)=>`<span class="seg"><span class="${v==='Accept'?'on':''}">Accept</span><span class="${v==='Reject'?'on rej':''}">Reject</span></span>`
const res=(v)=>v==='In progress'?`<span class="res prog"><i></i>Open</span>`:v==='Accepted'?`<span class="res acc"><i></i>Accepted</span>`:v==='Rejected'?`<span class="res rej"><i></i>Rejected</span>`:v?seg(v):''
const toast=(t,ring)=>`<div class="toast" style="left:720px;top:770px" ${ring?'data-ring="a"':''}><span class="ok">${ICO.check}</span>${t}</div>`
const R=(k)=>`data-ring="${k}"`

/* ---------- object header ---------- */
function oh({id='1505899',conf=true,validated=false,tabs,active,act='',ringTitle=false,ringTab=null,ringConf=false}){
  return `<div class="ph" style="height:132px"><div class="crumb">My worklist &nbsp;/&nbsp; ${id.split('/')[0]}</div>
  <div class="otitle" ${ringTitle?R('a'):''}><span class="h1">Order confirmation ${id}</span>${chip('High')}
  ${validated?`<span class="chip c-acc">Validated</span>`:''}${conf?`<span class="conf" ${ringConf?R('a'):''}>${S}Read with 87% confidence<b><i style="width:87%"></i></b></span>`:''}</div>
  <div class="ometa" ${ringTitle?R('a'):''}><span>PO&nbsp;<span class="id" style="color:var(--ink)">4994546957</span></span><span>Helios Components AG</span><span>€164,865</span><span>Received 08.04.26</span></div>
  <div class="oact">${act}</div>
  <div class="tabs">${tabs.map(t=>`<span class="${t===active?'on':''}" ${t===ringTab?R('a'):''}>${t}</span>`).join('')}</div></div>`}

/* ---------- pdf ---------- */
function pdf(hl){
  const rows=[['20','SKU-4410-A','PCB Verbinder 40-polig / vergoldet','5.000','St.','1,20','19%','6.000,00'],['30','SKU-3392-D','Widerstandsnetzwerk 4,7 kOhm +/-1%','8.500','St.','0,09','19%','765,00']]
  const lines=(n,w=[90,80,95,70,85])=>Array.from({length:n},(_,i)=>`<div class="ln" style="width:${w[i%w.length]}%"></div>`).join('')
  return `<div class="pdf" style="top:24px;height:560px">
  <div class="bar"><span>HELIOS COMPONENTS AG</span><span style="font-weight:400;font-size:6px">Precision Electronic Components · Munich</span></div>
  <div style="display:flex;justify-content:space-between;margin-top:10px"><div style="width:40%">${lines(3,[70,50,60])}</div><div style="text-align:right;font:700 9px Arial;color:#333">AUFTRAGSBESTÄTIGUNG<br><span style="font-weight:400;font-size:6.5px">Nr. 1505899 · Bestellung 4994546957</span></div></div>
  <div style="margin:8px 0;display:flex;gap:16px"><span>Zahlungsbedingungen: <span class="${hl?'hl':''}" style="color:#333">45 Tage netto</span></span><span>Lieferung: voraussichtlich KW 13</span></div>
  <table><tr><th>Pos</th><th>Artikel-Nr.</th><th>Bezeichnung / Description</th><th>Menge</th><th>ME</th><th>Preis (EUR)</th><th>MwSt.</th><th>Gesamtpreis</th></tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>
  <div style="margin:12px 0 0 auto;width:46%"><div style="display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:3px 0"><span>Nettobetrag / Net</span><span>EUR 146.925,00</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:3px 0"><span>MwSt. 19% / VAT 19%</span><span>EUR 27.915,75</span></div><div style="display:flex;justify-content:space-between;background:#eee;padding:4px 3px;font-weight:700;color:#333"><span>Rechnungsbetrag / Invoice Total</span><span>EUR 174.840,75</span></div></div>
  <div style="margin-top:14px;border:1px solid #ddd;padding:6px;display:flex;gap:8px"><span style="width:50px">Hinweis / Note:</span><div style="flex:1"><b style="color:#333">Pos. 30 Teillieferung / Partial Shipment:</b> Aufgrund temporärer Lieferengpässe liefern wir zunächst 6.500 Stück.${lines(2)}</div></div>
  <div class="h">3. QUALITÄT UND KONFORMITÄT / QUALITY &amp; COMPLIANCE</div>${['Zertifizierung','IATF 16949','RoHS / REACH','Konformität'].map(t=>`<div style="display:flex;gap:10px;margin:3px 0"><span style="width:90px">${t}</span><div style="flex:1">${lines(1,[80])}${lines(1,[55])}</div></div>`).join('')}
  <div class="h">4. BESONDERE BEDINGUNGEN / SPECIAL CONDITIONS</div>${['Preisbasis','Verpackung','Gewährleistung','Gerichtsstand'].map(t=>`<div style="display:flex;gap:10px;margin:3px 0"><span style="width:90px">${t}</span><div style="flex:1">${lines(1,[92])}${lines(1,[64])}</div></div>`).join('')}</div>
  <div class="pdf" style="top:600px;height:200px"><div class="bar"><span>HELIOS COMPONENTS AG</span><span style="font-weight:400;font-size:6px">Seite 2</span></div>${lines(4)}</div>
  <div style="position:absolute;right:36px;top:32px"><span class="chip c-n" style="background:#fff;box-shadow:var(--hair)">Page 1 of 2</span></div>`}

/* ---------- extraction ---------- */
function extraction({mode='read',tab='Extraction v1.0',tabs,validated=false,act,dialog='',toastTxt='',editing=false,conf=true,ringConf=false,ringTab=null,ringBody=false,ringFields=false,ringCell=false}){
  const F=[['Supplier','294730'],['Supplier name','Helios Components AG'],['Purchaser','FR0L'],['Payment terms',editing?'GL15: Net 45 days':'GI15: Net 45 days after invoice date'],['Created on','Jan 5, 2026'],['Incoterms','EXW'],['OC total net value','EUR 164,865'],['Sum of OC items','6'],['Additional costs','65.00']]
  const fv=(l,v)=>mode==='read'?`<div class="v">${v}</div>`:`<div class="cell ${editing&&l==='Payment terms'?'focus':''}" style="margin-top:6px" ${ringCell&&l==='Payment terms'?R('a'):''}>${v}${l==='Created on'?`<span style="margin-left:auto">${ICO.cal}</span>`:''}</div>`
  const LI=[['SKU-8821-B','Steuerungsmodul Rev.B','2,400','EA','25.03','Jun 4, 2026'],['SKU-4410-A','PCBC 40-pin','2,000','EA','22.65','Jun 4, 2026'],['SKU-4411-B','PCBC 40-pin -2','1,800','EA','22.39','Jul 14, 2026'],['SKU-4412-C','Widerstandsnetzwerk 4.7kΩ','1,500','EA','12.80','Jul 14, 2026'],['SKU-3392-D','Resistor network 4.7kΩ','8,500','EA','0.09','Jul 14, 2026']]
  const c=(v,r)=>mode==='read'?v:`<div class="cell ${r?'r':''}">${v}</div>`
  const li=LI.map(r=>`<tr><td class="id">${c(r[0])}</td><td>${c(r[1])}</td><td class="r num">${c(r[2],1)}</td><td>${c(r[3])}</td><td class="r num">${c(r[4],1)}</td><td>${c(r[5])}</td></tr>`).join('')
  return oh({tabs:tabs||[tab,'Activity'],active:tab,validated,act,conf,ringTab,ringConf})+
  `<div class="xl" ${ringBody?R('b'):''}>
   <div style="position:absolute;left:32px;right:24px;top:20px;display:flex;justify-content:space-between;align-items:center"><span class="k">What the agent read</span>${mode==='read'?`<span class="btn btn-s btn-sm" ${validated?'style="color:var(--ink-4)"':''}>Edit</span>`:`<span class="chip c-acc">Editing</span>`}</div>
   <div class="panel" style="position:absolute;left:32px;right:24px;top:60px;overflow:hidden" ${ringFields?R('a'):''}><div class="fg">${F.map(([l,v])=>`<div><div class="k">${l}</div>${fv(l,v)}</div>`).join('')}</div></div>
   <div class="panel" style="position:absolute;left:32px;right:24px;top:274px;overflow:hidden"><div style="height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px"><span style="font:400 14.5px var(--sans)">Line items</span><span class="k">6 lines</span></div><table><tr><th>Material</th><th>Description</th><th class="r">Quantity</th><th>UoM</th><th class="r">Unit price</th><th>Delivery</th></tr>${li}</table></div>
   ${mode!=='read'?`<div class="panel" style="position:absolute;left:32px;right:24px;top:640px;height:48px;display:flex;align-items:center;padding:0 8px 0 16px;gap:8px"><span class="muted" style="flex:1;font-size:13px">Changes are logged for audit.</span><span class="btn btn-g btn-sm">Cancel</span><span class="btn btn-p btn-sm">Save</span></div>`:''}
  </div><div class="xr" ${ringBody?R('b'):''}>${pdf(editing)}</div>${dialog}${toastTxt}`}

/* ---------- discrepancies ---------- */
const H=[['Total invoice value','€142,800','€164,865','+€22,065 · 15.4%','High','Unit price change times quantity. Approving overpays by €22,065.','AS'],['Payment terms','Net 30','Net 45','+15 days','High','Read from “45 Tage netto”. Longer terms need finance approval.','AS'],['Additional costs','none','€65.00','New cost','Medium','A freight charge that is not on the PO.','AS']]
const L=[['1001 · Unit price','€15.83','€25.03','+58%','High','Same change as the total. Approving overpays by €22,065.','AS'],['1001 · Description','Microcontroller Module Rev.B','Steuerungsmodul Rev.B','German term','Low','The same part, named in German.','AS'],['1002 · Quantity','2,500','2,000','−500 units','Medium','Only 2,000 confirmed. Stock may cover it.','RN'],['1004 · Delivery date','Jun 4','Jul 14','+40 days','High','Six weeks later than requested.','RN']]
const OWN={AS:'p2',RN:'p3'}
function disc({id='1505899',hRes,lRes,hRows=[0,1,2],lRows=[0,1,2,3],rec,act='',footer=null,toastTxt='',dialog='',ringTable=false,ringMine=null,ringNext=false,ringTitle=false,people,mods={}}){
  const row=(r,v,ring,dim)=>`<tr ${ring?R('a'):''} ${dim?'class="dim"':''}><td style="width:146px;height:52px">${r[0]}</td><td style="width:206px"><div class="chg"><span class="o"><s>${r[1]}</s> → <span style="color:${dim?'inherit':'var(--ink)'}">${r[2]}</span></span><span class="num" style="font-size:12.5px;color:var(--ink-2)">${r[3]}</span></div></td><td style="width:92px">${chip(r[4])}</td><td class="wrap"><div class="ai">${S}<span>${r[5]}</span></div></td><td style="width:52px"><span class="av sm ${OWN[r[6]]}">${r[6]}</span></td><td style="width:150px">${res(v)}</td></tr>`
  let Hr=hRows.map(i=>[...H[i]]),Lr=lRows.map(i=>[...L[i]])
  if(mods.terms){Hr=Hr.map(r=>r[0]==='Payment terms'?['Payment terms','Net 30','Net 35','+5 days','Medium','Read from “35 Tage netto”. Closer to the PO than version 1.','AS']:r)}
  const body=`<tr class="grp"><td colspan="6">Order</td></tr>`+Hr.map((r,k)=>row(r,hRes[k],ringMine&&ringMine.includes('h'+k),ringMine&&!ringMine.includes('h'+k))).join('')+`<tr class="grp"><td colspan="6">Line items</td></tr>`+Lr.map((r,k)=>row(r,lRes[k],ringMine&&ringMine.includes('l'+k),ringMine&&!ringMine.includes('l'+k))).join('')
  const decided=[...hRes,...lRes].filter(v=>['Accepted','Rejected','Accept','Reject'].includes(v)).length, total=hRes.length+lRes.length
  return oh({id,conf:false,tabs:['Differences','Extraction','Activity'],active:'Differences',act,ringTitle})+
  `<div class="main"><div class="panel" style="overflow:hidden" ${ringTable?R('a'):''}><div style="height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px"><span style="font:400 15px var(--sans)">Differences from the purchase order</span><div class="views"><span class="on">All <em>${total}</em></span><span>Mine <em>${people.mine}</em></span></div></div>
   <table><tr><th>Field</th><th>PO → Confirmation</th><th>Severity</th><th>Agent's reasoning</th><th>Owner</th><th>Decision</th></tr>${body}</table></div>
   ${footer!==false?`<div class="panel" style="margin-top:12px;height:52px;display:flex;align-items:center;padding:0 10px 0 16px;gap:10px"><span class="muted" style="flex:1;font-size:13px">${footer||`${decided} of ${total} decided`}</span><span class="btn btn-g btn-sm">Cancel</span><span class="btn btn-p btn-sm">Save decisions</span></div>`:''}
  </div>
  <div class="rail"><div class="panel rec"><span class="k" style="display:flex;gap:7px;align-items:center">${S}Agent recommendation</span><div class="say">${rec.say}</div><div class="why">${rec.why}</div>
   <div class="next" ${ringNext?R('a'):''}><span class="k">Next</span><div class="t">${rec.next[0]}</div><div class="d">${rec.next[1]}</div>${rec.btn||''}</div></div>
   <div class="panel" style="padding:14px 16px"><span class="k">Who decides</span><div style="margin-top:8px">${people.rows.map(p=>`<div class="who"><span class="av sm ${p[0]==='AS'?'p2':'p3'}">${p[0]}</span><span class="n">${p[1]}</span><span class="c">${p[2]}</span><span class="bar2"><i style="width:${p[3]}%"></i></span></div>`).join('')}</div></div>
   <div class="panel" style="padding:14px 16px"><span class="k">Order risk</span><div style="display:flex;align-items:center;gap:10px;margin-top:10px">${chip('High')}<span class="muted" style="font-size:13px">Set by the most severe difference</span></div></div>
  </div>${dialog}${toastTxt}`}
