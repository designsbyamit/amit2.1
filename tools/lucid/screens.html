<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lucid.css"><style>
/* object page header */
.oh{position:absolute;left:0;right:0;top:0;height:140px;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.crumb{position:absolute;left:48px;top:14px;font:400 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.crumb a{color:var(--ink-2)}
.otitle{position:absolute;left:46px;top:30px;display:flex;align-items:center;gap:14px}
.otitle h1{font:200 34px/1.1 var(--sans);letter-spacing:-.03em}
.otitle .dd{width:14px;height:14px;color:var(--ink-3);margin-left:-4px}
.ometa{position:absolute;left:48px;top:76px;display:flex;align-items:center;gap:0;color:var(--ink-2);font-size:13.5px}
.ometa span{padding:0 12px;border-left:1px solid var(--line-2)}.ometa span:first-child{padding-left:0;border:0}
.ometa .num{color:var(--ink);font-size:12.5px}
.oact{position:absolute;right:48px;top:44px;display:flex;gap:8px}
.tabs{position:absolute;left:48px;bottom:0;display:flex;gap:30px;height:30px}
.tabs span{font:400 13.5px var(--sans);color:var(--ink-3);position:relative;display:flex;align-items:flex-start;padding-top:4px}
.tabs span.on{color:var(--ink)}.tabs span.on:after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--ink)}
.conf{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 12px 0 10px;border-radius:99px;background:var(--agent-tint);font:400 12.5px var(--sans);color:#4B35C4}
.conf b{display:block;width:44px;height:4px;border-radius:4px;background:rgba(124,92,255,.18);overflow:hidden}.conf b i{display:block;height:100%;background:var(--agent)}
.conf .num{font-size:12px;color:#4B35C4}
/* extraction */
.xl{position:absolute;left:0;top:140px;width:968px;bottom:0;overflow:hidden}
.xbar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 48px 0 48px;border-bottom:1px solid var(--line);font:400 15px var(--sans)}
.xr{position:absolute;left:968px;right:0;top:140px;bottom:0;background:var(--sunk);overflow:hidden;box-shadow:inset 1px 0 0 var(--line)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:32px;padding:6px 20px 0}
.fl{height:72px}.fl .lab{font:400 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-top:16px}
.fl .val{margin-top:8px;font-size:14.5px}
.fe{height:78px}.fe .lab{font:400 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-top:12px;margin-bottom:8px}
.dot{display:inline-block;width:6px;height:6px;border-radius:99px;margin-right:6px;vertical-align:1px}
/* pdf */
.pdf{position:absolute;left:24px;right:24px;background:#fff;border-radius:6px;box-shadow:var(--e2);padding:26px 26px;font:6.5px/1.5 Arial,sans-serif;color:#555;overflow:hidden}
.pdf .bar{background:#2a2b2f;color:#fff;font:700 9px Arial;padding:6px 8px;display:flex;justify-content:space-between}
.pdf table td,.pdf table th{height:auto;padding:3px 4px;font:6px Arial;color:#555;border-bottom:1px solid #ddd;text-transform:none;letter-spacing:0;white-space:normal}
.pdf table th{background:#2a2b2f;color:#fff;font-weight:700}
.pdf .h{font:700 7px Arial;color:#333;margin:10px 0 4px}
.pdf .ln{height:5px;background:#e3e3e3;border-radius:2px;margin:4px 0}
/* discrepancies */
.dv{position:absolute;left:0;right:0;top:140px;bottom:0;padding:0 48px;overflow:hidden}
.ins{position:absolute;left:48px;right:48px;top:24px;height:192px;background:var(--surface);border-radius:var(--r3);box-shadow:var(--e2);overflow:hidden}
.ins .hd{display:flex;align-items:center;gap:10px;padding:18px 24px 0 26px;font:400 15px var(--sans)}
.ins .sub{padding:10px 26px 0;color:var(--ink-2);font-size:14px}
.ins .na{position:absolute;left:24px;right:24px;top:96px;border-radius:var(--r2);background:var(--canvas);box-shadow:inset 0 0 0 1px var(--line);padding:16px 18px}
.ins .na .t{font:400 14px var(--sans)}.ins .na .d{color:var(--ink-2);margin-top:4px;font-size:13.5px}
.tcard{position:absolute;left:48px;right:48px;background:var(--surface);border-radius:var(--r3);box-shadow:var(--e1);overflow:hidden}
.tcard .card-h{height:42px}
.tcard td{font-size:13.5px}
.tcard td.mid{height:48px}
.foot{position:absolute;left:48px;right:48px;bottom:16px;height:48px;border-radius:14px;background:rgba(255,255,255,.92);box-shadow:var(--e2);display:flex;justify-content:flex-end;align-items:center;padding:0 8px;gap:6px;z-index:6}
/* worklist */
.wh{position:absolute;left:0;right:0;top:0;height:147px;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.wh h1{position:absolute;left:46px;top:20px;font:200 34px/1.1 var(--sans);letter-spacing:-.03em}
.flt{position:absolute;top:79px;display:flex;flex-direction:column;gap:6px}
.flt .lab{position:absolute;top:-20px;font:400 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.wt{position:absolute;left:48px;right:48px;background:var(--surface);border-radius:var(--r3);box-shadow:var(--e1);overflow:hidden}
.wt td{font-size:13.5px}
.kpi{position:absolute;top:164px;width:240px;height:84px;background:var(--surface);border-radius:var(--r3);box-shadow:var(--e1);padding:16px 20px}
.kpi .v{font:200 32px/1 var(--sans);letter-spacing:-.03em;margin-top:12px}.kpi .v small{font-size:15px;color:var(--ink-3);margin-left:2px}
.grp td{background:#FAFAF8}
/* activity */
.tl{position:absolute;left:48px;right:48px;top:68px;height:600px;background:var(--surface);border-radius:var(--r3);box-shadow:var(--e1);padding:20px 28px}
.tli{position:relative;padding-left:34px;height:74px}
.tli:before{content:'';position:absolute;left:9px;top:22px;bottom:-4px;width:1px;background:var(--line-2)}
.tli:last-child:before{display:none}
.tli .m{position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:99px;display:grid;place-items:center;font:500 8.5px var(--sans);color:var(--ink-2);background:var(--sunk)}
.tli .m.ag{background:var(--agent);color:#fff}
.tli .m.sys{background:#fff;box-shadow:inset 0 0 0 1px var(--line-2)}
.tli .ts{font:400 11px var(--mono);color:var(--ink-3);letter-spacing:-.01em}
.tli .tx{margin-top:3px;font-size:14px}.tli .by{margin-top:1px;font-size:13px;color:var(--ink-3)}
.tli .tx a{color:var(--accent);font-weight:400;margin-left:4px}
</style></head><body><script>
const S=`<svg class="spark" viewBox="0 0 16 16"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#22C7E8"/></linearGradient></defs><path fill="url(#g)" d="M8 0l1.7 5.1L15 7l-5.3 1.9L8 14l-1.7-5.1L1 7l5.3-1.9z"/></svg>`
const CHEV=`<svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 4.5l3 3 3-3"/></svg>`
const ICO={bell:`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 14V9a5 5 0 0110 0v5l1.5 1.5h-13zM8.5 17.5h3"/></svg>`,help:`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="10" cy="10" r="7.5"/><path d="M8 8a2 2 0 113 1.7c-.7.4-1 .8-1 1.6M10 14v.2"/></svg>`,send:`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M14 2L7 9M14 2l-4.5 12-2.5-5-5-2.5z"/></svg>`,cal:`<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="#8A8C95" stroke-width="1.3"><rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/></svg>`,search:`<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="#8A8C95" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>`,check:`<svg viewBox="0 0 10 10" width="9" height="9" fill="none" stroke="#fff" stroke-width="1.6"><path d="M2 5.2l2 2 4-4.4"/></svg>`}
const P={ops:['DP',''],buyer:['AS','p2'],gr:['RN','p3'],admin:['EH','p4']}
const topbar=(who)=>`<div class="top"><span class="menu"><i></i><i></i><i></i></span><span class="logo"></span><span class="prod">Order confirmations <span>· assistant</span></span><span class="sp"></span><div class="ask">${S}Ask about an order or a supplier<kbd>⌘K</kbd></div><span class="sp"></span><span class="ic">${ICO.bell}</span><span class="ic">${ICO.help}</span><span class="av ${P[who][1]}">${P[who][0]}</span></div>`
const chip=(r)=>`<span class="chip ${{High:'c-high',Medium:'c-med',Low:'c-low'}[r]}"><i></i>${r}</span>`
const seg=(v)=>`<span class="seg"><span class="${v==='Accept'?'on':''}">Accept</span><span class="${v==='Reject'?'on rej':''}">Reject</span></span>`
const res=(v,dim)=>v==='In progress'?`<span class="res prog"><i></i>In progress</span>`:v==='Accepted'?`<span class="res acc ${dim?'dim':''}"><i></i>Accepted</span>`:v==='Rejected'?`<span class="res rej ${dim?'dim':''}"><i></i>Rejected</span>`:v?seg(v):''
const toast=(t,x,y)=>`<div class="toast" style="left:${x}px;top:${y}px"><span class="ok">${ICO.check}</span>${t}</div>`

/* ---------- object page header ---------- */
function oh({id='1505899',conf=true,validated=false,tabs,active,act='',risk='High'}){
  return `<div class="oh"><div class="crumb"><a>My worklist</a> &nbsp;/&nbsp; ${id.split('/')[0]}</div>
  <div class="otitle"><h1>Order confirmation ${id}</h1><svg class="dd" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 4.5l3 3 3-3"/></svg>
  ${validated?`<span class="chip c-acc"><i></i>Validated</span>`:''}${conf?`<span class="conf">${S}Confidence<b><i style="width:87%"></i></b><span class="num">87%</span></span>`:''}</div>
  <div class="ometa"><span>PO <span class="num" style="padding:0;border:0">4994546957</span></span><span>Helios Components AG</span><span>Order value <span class="num" style="padding:0;border:0">€164,865</span></span><span style="display:flex;align-items:center;gap:8px">Risk ${chip(risk)}</span></div>
  <div class="oact">${act}</div>
  <div class="tabs">${tabs.map(t=>`<span class="${t===active?'on':''}">${t}</span>`).join('')}</div></div>`}

/* ---------- pdf ---------- */
function pdf(){
  const rows=[['20','SKU-4410-A','PCB Verbinder 40-polig / vergoldet','5.000','St.','1,20','19%','6.000,00'],['30','SKU-3392-D','Widerstandsnetzwerk 4,7 kOhm +/-1%','8.500','St.','0,09','19%','765,00']]
  const lines=(n,w=[90,80,95,70,85])=>Array.from({length:n},(_,i)=>`<div class="ln" style="width:${w[i%w.length]}%"></div>`).join('')
  return `<div class="pdf" style="top:28px;height:600px">
  <table><tr><th>Pos</th><th>Artikel-Nr.</th><th>Bezeichnung / Description</th><th>Menge</th><th>ME</th><th>Preis (EUR)</th><th>MwSt.</th><th>Gesamtpreis</th></tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>
  <div style="margin:12px 0 0 auto;width:46%"><div style="display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:3px 0"><span>Nettobetrag / Net</span><span>EUR 146.925,00</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:3px 0"><span>MwSt. 19% / VAT 19%</span><span>EUR 27.915,75</span></div><div style="display:flex;justify-content:space-between;background:#eee;padding:4px 3px;font-weight:700;color:#333"><span>Rechnungsbetrag / Invoice Total</span><span>EUR 174.840,75</span></div></div>
  <div style="margin-top:14px;border:1px solid #ddd;padding:6px;display:flex;gap:8px"><span style="width:50px">Hinweis / Note:</span><div style="flex:1"><b style="color:#333">Pos. 30 Teillieferung / Partial Shipment:</b> Aufgrund temporärer Lieferengpässe liefern wir zunächst 6.500 Stück. Die verbleibenden 1.500 Stück werden voraussichtlich in Kalenderwoche 16 nachgeliefert.${lines(2)}</div></div>
  <div class="h">3. QUALITÄT UND KONFORMITÄT / QUALITY &amp; COMPLIANCE</div>${['Zertifizierung','IATF 16949','RoHS / REACH','Konformitätserklärung','Qualitätszertifikat'].map(t=>`<div style="display:flex;gap:10px;margin:3px 0"><span style="width:90px">${t}</span><div style="flex:1">${lines(1,[80])}${lines(1,[55])}</div></div>`).join('')}
  <div class="h">4. BESONDERE BEDINGUNGEN / SPECIAL CONDITIONS</div>${['Preisbasis','Verpackung','Mindestbestellmenge','Gewährleistung','Gerichtsstand'].map(t=>`<div style="display:flex;gap:10px;margin:3px 0"><span style="width:90px">${t}</span><div style="flex:1">${lines(1,[92])}${lines(1,[64])}</div></div>`).join('')}
  <div style="margin-top:22px">Wir freuen uns auf die weitere Zusammenarbeit und stehen für Rückfragen gerne zur Verfügung.</div></div>
  <div class="pdf" style="top:650px;height:200px;padding-top:24px"><div class="bar"><span>HELIOS COMPONENTS AG</span><span style="font-weight:400;font-size:6px">Precision Electronic Components · Munich</span></div><div style="text-align:right;font:700 9px Arial;color:#333;margin-top:12px">AUFTRAGSBESTÄTIGUNG</div>${lines(3)}</div>`}

/* ---------- extraction page ---------- */
function extraction({mode='read',tab='Original extraction v1.0',tabs,validated=false,act,dialog='',toastTxt='',editing=false}){
  const F=[['Supplier','294730'],['Payment terms',editing?'GL15: Net 45 days':'GI15: Net 45 days after invoice date'],['Supplier name','Helios Components AG'],['Sum of OC items','6'],['Purchaser','FR0L'],['OC total net value','EUR  164,865'],['Created on','Jan 5, 2026'],['Additional costs','65.00'],['Incoterms','EXW'],['','']]
  let grid
  if(mode==='read') grid=F.map(([l,v])=>`<div class="fl">${l?`<div class="lab">${l}</div><div class="val">${l==='OC total net value'?'<span class="num" style="font-size:13.5px">EUR 164,865</span>':v}</div>`:''}</div>`).join('')
  else grid=F.map(([l,v])=>`<div class="fe">${l?`<div class="lab">${l}</div>${l==='OC total net value'?`<div style="display:flex;gap:8px"><div class="field" style="width:200px">EUR${CHEV}</div><div class="field" style="flex:1"><span class="num">164,865</span></div></div>`:`<div class="field ${editing&&l==='Payment terms'?'focus':''}">${v}${l==='Created on'?`<span style="margin-left:auto">${ICO.cal}</span>`:''}</div>`}`:''}</div>`).join('')
  const LI=[['SKU-8821-B','Steuerungsmodul Rev.B','2,400','EA','EUR','25.03','Jun 4, 2026'],['SKU-4410-A','PCBC 40-pin','2,000','EA','EUR','22.65','Jun 4, 2026'],['SKU-4411-B','PCBC 40-pin -2','1,800','EA','EUR','22.39','Jul 14, 2026'],['SKU-4412-C','Widerstandsnetzwerk 4.7kΩ','1,500','EA','EUR','12.80','Jul 14, 2026']]
  const li=mode==='read'?LI.map(r=>`<tr><td class="id">${r[0]}</td><td>${r[1]}</td><td class="r num">${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td class="r num">${r[5]}</td><td>${r[6]}</td></tr>`).join('')
    :LI.map(r=>`<tr><td style="height:34px"><div class="field" style="height:28px;width:118px"><span class="num">${r[0]}</span></div></td><td><div class="field" style="height:28px;width:200px">${r[1]}</div></td><td class="r"><div class="field" style="height:28px;width:70px;justify-content:flex-end"><span class="num">${r[2]}</span></div></td><td><div class="field" style="height:28px;width:62px">${r[3]}${CHEV}</div></td><td><div class="field" style="height:28px;width:76px">${r[4]}${CHEV}</div></td><td class="r"><div class="field" style="height:28px;width:70px;justify-content:flex-end"><span class="num">${r[5]}</span></div></td><td><div class="field" style="height:28px;width:118px">${r[6].slice(0,8)}…<span style="margin-left:auto">${ICO.cal}</span></div></td></tr>`).join('')
  const editBtn=mode==='read'?`<span class="btn btn-s btn-sm" ${validated?'style="color:var(--ink-4)"':''}>Edit</span>`:''
  return oh({tabs:tabs||[tab],active:tab,validated,act})+
  `<div class="xl"><div class="xbar">Extracted data${editBtn}</div>
   <div class="card" style="position:absolute;left:48px;right:24px;top:62px;height:${mode==='read'?435:465}px"><div class="card-h"><h3>Header</h3><span class="k">${S}</span></div><div style="border-top:1px solid var(--line)"></div><div class="fgrid">${grid}</div></div>
   <div class="card" style="position:absolute;left:48px;right:24px;top:${mode==='read'?512:542}px;height:300px;overflow:hidden"><div class="card-h"><h3>Line items</h3></div><table><tr><th>Material</th><th>Description</th><th class="r">Quantity</th><th>UoM</th><th>Currency</th><th class="r">Unit price</th><th>Delivery date</th></tr>${li}</table></div>
   ${editing?`<div class="foot" style="left:48px;right:24px;bottom:auto;top:700px"><span class="btn btn-p btn-sm">Save</span><span class="btn btn-g btn-sm">Cancel</span></div>`:''}
  </div><div class="xr">${pdf()}</div>${dialog}${toastTxt}`}

/* ---------- discrepancies page ---------- */
const H=[['Total invoice value','€142,800','€164,865','+€22,065 (15.4%)','High','Price change times quantity. Approving overpays by €22,065.'],['Payment terms','Net 30 days','Net 45 days','+15 days','High','Read from German “45 Tage netto”. Finance must approve longer terms.'],['Additional costs','–','€65.00','new','Medium','Freight charge found on the confirmation, not on the PO.']]
const L=[['1001','SKU-8821-B','Unit price','€15.83','€25.03','+€22,065','High','Price change times quantity. Approving overpays by €22,065.'],['','','Description','Microcontroller Module Rev.B','Steuerungsmodul Rev.B','German term','Low','Same part in German. No functional difference.'],['1002','SKU-4410-A','Quantity','2,500','2,000','−500 units','Medium','Only 2,000 confirmed. Stock may cover it; the goods recipient decides.'],['1004','SKU-4412-C','Delivery date','Jun 4, 2026','Jul 14, 2026','+40 days','High','Six weeks later than requested.']]
function disc({id='1505899',hRes,lRes,lRows=[0,1,2,3],hRows=[0,1,2],next,sub='Multiple differences, order value above €142,800',share=false,act='',foot=true,toastTxt='',dialog='',tab='Discrepancies',edit=false}){
  const insH=share?236:192
  const hTop=insH+48, hH=42+34+32*hRows.length
  const lTop=hTop+hH+16
  const ht=hRows.map((i,k)=>{const r=H[i];return `<tr><td style="width:150px">${r[0]}</td><td style="width:106px">${r[1]}</td><td style="width:106px">${r[2]}</td><td class="num" style="width:136px;color:var(--ink)">${r[3]}</td><td style="width:84px">${chip(r[4])}</td><td><div class="ai">${S}${r[5]}</div></td><td style="width:150px">${res(hRes[k],hRes[k]==='In progress')}</td></tr>`}).join('')
  const lt=lRows.map((i,k)=>{const r=L[i];return `<tr><td class="mid id" style="width:70px">${r[0]}</td><td class="id" style="width:104px">${r[1]}</td><td style="width:110px">${r[2]}</td><td class="wrap" style="width:116px">${r[3]}</td><td class="wrap" style="width:116px">${r[4]}</td><td class="num" style="width:100px">${r[5]}</td><td style="width:80px">${chip(r[6])}</td><td class="wrap"><div class="ai">${S}${r[7]}</div></td><td style="width:150px">${res(lRes[k],lRes[k]==='In progress'||lRes[k]==='dim-a'||lRes[k]==='dim-r')}</td></tr>`}).join('')
  return oh({id,conf:false,tabs:['Discrepancies','Extraction','Activity'],active:tab,act})+
  `<div class="dv">
   <div class="ins" style="height:${insH}px"><span class="agent-bar"></span><div class="hd">${S}Recommendation <span class="chip c-agent" style="margin-left:4px">Agent</span></div><div class="sub">${sub}</div>
   <div class="na" style="${share?'height:122px':''}"><div class="t">${next[0]}</div><div class="d">${next[1]}</div>${share?`<span class="btn btn-agent btn-sm" style="margin-top:12px">${ICO.send}Draft the reply</span>`:''}</div></div>
   <div class="tcard" style="top:${hTop}px"><div class="card-h"><h3>Order differences</h3>${edit?'<span class="btn btn-s btn-sm">Edit</span>':''}</div><table><tr><th>Field</th><th>PO</th><th>Confirmation</th><th>Change</th><th>Severity</th><th>Agent's reasoning</th><th>Decision</th></tr>${ht}</table></div>
   <div class="tcard" style="top:${lTop}px"><div class="card-h"><h3>Line item differences</h3>${edit?'<span class="btn btn-s btn-sm">Edit</span>':''}</div><table><tr><th>Line</th><th>Material</th><th>Field</th><th>PO</th><th>Confirmation</th><th>Change</th><th>Severity</th><th>Agent's reasoning</th><th>Decision</th></tr>${lt}</table></div>
  </div>${foot?`<div class="foot"><span class="btn btn-p btn-sm">Save decisions</span><span class="btn btn-g btn-sm">Cancel</span></div>`:''}${dialog}${toastTxt}`}
